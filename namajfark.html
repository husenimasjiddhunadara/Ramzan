<!DOCTYPE html>
<html lang="gu" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>નમાઝમાં ફર્ક | Developed by Pathan Mahirkhan</title>
    
    <!-- Stylish Professional Gujarati Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@500;600;700;800&family=Hind+Vadodara:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #fafcff;
            --bg-surface: #ffffff;
            
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            
            --primary: #2563eb;
            --border: #e2e8f0;
            
            --font-heading: 'Anek Gujarati', sans-serif;
            --font-body: 'Hind Vadodara', sans-serif;
            --font-en: 'Inter', sans-serif;
            
            --radius-md: 12px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-body);
            color: var(--text-body);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .main-heading {
            font-family: var(--font-heading);
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 800;
            text-align: center;
            color: var(--text-heading);
            margin-bottom: 3.5rem;
            letter-spacing: -0.5px;
        }

        /* Minimal Search & Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .search-input {
            flex-grow: 1;
            max-width: 400px;
            padding: 0.9rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            font-family: var(--font-body);
            font-size: 1.15rem;
            outline: none;
            background: var(--bg-surface);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            color: var(--text-heading);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }

        .btn-toggle {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-heading);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        
        .btn-toggle:hover {
            border-color: var(--text-muted);
            background: #f8fafc;
        }

        /* Cards */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .step-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .step-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .step-header {
            padding: 1.4rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: background 0.2s ease;
        }

        .step-card:not(.collapsed) .step-header {
            border-bottom-color: var(--border);
            background: #f8fafc;
        }

        .step-num {
            font-family: var(--font-en);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            background: #eff6ff;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .step-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-heading);
            flex-grow: 1;
        }

        /* Pure CSS Chevron */
        .indicator {
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            transform: rotate(225deg);
            transition: transform 0.3s ease;
            margin-top: 4px;
        }
        .step-card.collapsed .indicator { 
            transform: rotate(45deg);
            margin-top: -4px;
        }

        /* Smooth Expand/Collapse */
        .grid-outer {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .step-card.collapsed .grid-outer {
            grid-template-rows: 0fr;
        }

        .grid-inner {
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .panel {
            padding: 1.8rem;
        }

        .panel:first-child {
            border-right: 1px solid var(--border);
        }

        .panel-heading {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid var(--border);
        }

        .panel-male .panel-heading { border-bottom-color: #3b82f6; }
        .panel-female .panel-heading { border-bottom-color: #ec4899; }

        .panel-text {
            font-size: 1.15rem;
            color: var(--text-body);
        }

        .panel-text ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .panel-text li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.8rem;
        }
        
        .panel-text li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }
        
        .panel-male li::before { background-color: #3b82f6; }
        .panel-female li::before { background-color: #ec4899; }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.2rem;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border);
            font-family: var(--font-body);
        }

        /* Dev Badge */
        .footer {
            margin-top: 5rem;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 3rem;
        }
        
        .dev-badge {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: var(--text-heading);
            color: #ffffff;
            border-radius: 50px;
            font-family: var(--font-en);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dev-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            .grid-inner { grid-template-columns: 1fr; }
            .panel:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .controls { flex-direction: column; align-items: stretch; }
            .search-input { max-width: 100%; }
            .step-header { padding: 1.2rem; }
            .panel { padding: 1.5rem 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Minimal Main Heading -->
        <h1 class="main-heading">મર્દ ઔર ઔરતકી નમાઝમેં ફર્ક</h1>
        
        <!-- Controls -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="અહીં શોધો..." onkeyup="appController.search()">
            <button class="btn-toggle" onclick="appController.toggleAll()" id="toggleBtn">
                બધા બંધ કરો
            </button>
        </div>

        <!-- Render Container -->
        <div class="step-list" id="stepsContainer">
            <!-- Cards injected via JS -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <a href="#" class="dev-badge">Developed by Pathan Mahirkhan</a>
        </div>
        
    </div>

    <!-- App Logic -->
    <script>
        const appData = [
            {
                id: 1,
                context: "હાલતે કયામમેં",
                male: "દોનોં કદમ કે બીચમેં થોડા સા ફાસલા રખેં.",
                female: "દોનોં કદમ સાથમેં રખે."
            },
            {
                id: 2,
                context: "હાથ ઉઠાનેમેં",
                male: "દોનોં હાથ કાન તક લે જાએ કે અંગૂઠે કાન કી લવ સે છુ જાયે, ઈસ હાલમેં કે હથેલીયાં કિબ્લા રૂખ હો.",
                female: "દોનોં હાથ કાનોં તક ન ઉઠાએ બલ્કે મૂંઢોં તક ઉઠાયે."
            },
            {
                id: 3,
                context: "હાથ બાંધનેમેં",
                male: "નાફકે નીચે બાંધે.",
                female: "સીને કે ઉપર હાથ રખે, બાંધે નહી."
            },
            {
                id: 4,
                context: "હાથ બાંધનેકા તરીકા",
                male: "બાંયે હાથકી હથેલીકી પીઠકે ઉપર સીધે હાથકી હથેલી રખે ઔર તીન ઉંગલિયાં હાથકી કલાઈ કે ઉપર રખે ઔર અંગૂઠા ઔર છોટી ઉંગલી સે કલાઈ પકડે.",
                female: "ઔરત હાથ નાફકે નીચે ન બાંધે બલ્કે હથેલી સીને પર છાતીકે નીચે રખકર ઉસકી પીઠ પર સીધે હાથકી હથેલી રખે પકડે નહી."
            },
            {
                id: 5,
                context: "રૂકૂઅમેં",
                male: "<ul><li>હાથકી ઉંગલિયોંકો ખુલી રખકર ઘૂટનોંકો પકડે.</li><li>બાઝૂઓંકો પસલિયોંસે અલગ રખે.</li></ul>",
                female: "<ul><li>ઉંગલિયોં કો મિલાકર ઘૂટનોં પર રખે.</li><li>બાઝૂઓંકો પસલિયોંકે સાથ મિલા દે.</li></ul>"
            },
            {
                id: 6,
                context: "હાલતે સજદહમે જાનેકા તરીકા",
                male: "<ul><li>ઝમીનકે ઉપર પહલે દોનોં ઘૂટને, ફિર દોનોં હાથ, ફિર નાક, ફિર પેશાની ઈસ તરહ રખે કે અંગૂઠેકે સામને આંખે રહે.</li><li>બાઝૂ પસલિયોં સે પેટ રાન સે, કોહનિયાં ઝમીનસે અલગ રખે, યા'ની ખૂબ ખુલકે સજદહ કરે.</li><li>દોનોં પેર ખડે રખે ઔર ઉંગલિયોંકા પેટ લગાતે હૂએ કિબ્લા તરફ રખે.</li></ul>",
                female: "<ul><li>ઝમીનકે ઉપર પહલે દોનોં પેર કે ઘૂટને, ફિર નઝદીકમેં દોનોં હાથ, ફિર નાક, ફિર પેશાની ઈસ તરહ રખે કે અંગૂઠે કે સામને આંખ રહે.</li><li>બાઝૂ પસલિયોં સે, પેટ રાન સે, કોહનિયા ઝમીન સે મિલા દે, યા'ની સિમટકર સજદહ કરેં.</li><li>દોનોં પૈરોં કો સીધી (જમણી) સાઈડ નિકાલે.</li></ul>"
            },
            {
                id: 7,
                context: "હાલતે જલ્સા ઔર કાઈદહમે રહનેકા તરીકા",
                male: "<ul><li>બાએં યા'ની (ડાબા) બાયેં પેર કી ઉપર બેઠે સીધા યા'ની દાયાં (જમણા) પેર ખડા રખે ઉસકી ઉંગલિયોંકો કિબ્લાકી જાનિબ રખે.</li><li>હાથકી ઉંગલિયા રાનોં પર ઉસકી હાલતમેં રખે.</li></ul>",
                female: "<ul><li>દોનોં પૈરોં કો દાઈ જાનિબ યા'ની (જમણી સાઈડ) નિકાલ કર બેઠે.</li><li>હાથકી ઉંગલિયાં રાનોં પર ઉસકી હાલતમેં રખે.</li></ul>"
            },
            {
                id: 8,
                context: "હાલતે સજદહ સે ખડે હોનેકા તરીકા",
                male: "પહલે પેશાની ઉઠાયે, ફિર નાક, ફિર હાથ ઘૂટને ઉસકે બાદ ઘૂટનોંકે ઉપર હાથ રખકર ખડે હો હાથ કો ઝમીન પર ન રખે. (હાલતે મજબૂરીમેં ચલ સકતા હૈ)",
                female: "પહલે પેશાની ઉઠાયે ફિર નાક, ફિર હાથ, ફિર ઝુકકર હાથ ઘૂટનોંકે ઉપર રખકર ખડે હો યાદ રહે હાલત બદલને ન પાયે."
            }
        ];

        class AppController {
            constructor(data) {
                this.data = data;
                this.container = document.getElementById('stepsContainer');
                this.isCollapsed = false; // default open
                this.init();
            }

            init() {
                this.renderCards(this.data);
            }

            renderCards(dataToRender) {
                this.container.innerHTML = '';
                
                if (dataToRender.length === 0) {
                    this.container.innerHTML = '<div class="no-results">કોઈ પરિણામ મળ્યું નથી. બીજો શબ્દ શોધી જુઓ.</div>';
                    return;
                }

                const fragment = document.createDocumentFragment();
                
                dataToRender.forEach((item) => {
                    const el = document.createElement('div');
                    el.className = 'step-card' + (this.isCollapsed ? ' collapsed' : '');
                    
                    el.innerHTML = `
                        <div class="step-header" onclick="appController.toggleCard(this)">
                            <div class="step-num">${item.id}</div>
                            <div class="step-title">${item.context}</div>
                            <div class="indicator"></div>
                        </div>
                        <div class="grid-outer">
                            <div class="grid-inner">
                                <div class="panel panel-male">
                                    <div class="panel-heading">મર્દ</div>
                                    <div class="panel-text">${item.male}</div>
                                </div>
                                <div class="panel panel-female">
                                    <div class="panel-heading">ઔરતેં</div>
                                    <div class="panel-text">${item.female}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(el);
                });
                
                this.container.appendChild(fragment);
            }

            toggleCard(headerElement) {
                const card = headerElement.parentElement;
                card.classList.toggle('collapsed');
            }

            toggleAll() {
                this.isCollapsed = !this.isCollapsed;
                const cards = document.querySelectorAll('.step-card');
                const btn = document.getElementById('toggleBtn');

                cards.forEach(card => {
                    if (this.isCollapsed) {
                        card.classList.add('collapsed');
                    } else {
                        card.classList.remove('collapsed');
                    }
                });

                if (this.isCollapsed) {
                    btn.textContent = 'બધા ખોલો';
                } else {
                    btn.textContent = 'બધા બંધ કરો';
                }
            }

            search() {
                const query = document.getElementById('searchInput').value.toLowerCase();
                const filtered = this.data.filter(item => 
                    item.context.toLowerCase().includes(query) ||
                    item.male.toLowerCase().includes(query) ||
                    item.female.toLowerCase().includes(query)
                );
                
                // Open all when searching
                this.isCollapsed = false;
                document.getElementById('toggleBtn').textContent = 'બધા બંધ કરો';
                
                this.renderCards(filtered);
            }
        }

        // Initialize App
        const appController = new AppController(appData);

    </script>
</body>
</html>
