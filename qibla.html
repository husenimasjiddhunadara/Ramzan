<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qibla Compass - Premium UI</title>
    
    <!-- Modern Minimalist Fonts: Anek Gujarati for text, Montserrat for numbers/English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@300;500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19; /* Deep matte navy/black */
            --card-bg: rgba(255, 255, 255, 0.03); /* Frosted glass */
            --gold: #e2c073; /* Elegant Rose Gold / Champagne */
            --gold-glow: rgba(226, 192, 115, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Anek Gujarati', sans-serif;
            background-color: var(--bg-color);
            /* Soft glowing background effect */
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(226, 192, 115, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(11, 15, 25, 1) 0%, transparent 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphism Card Design */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 40px 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .header-sub {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 300;
            margin-bottom: 45px;
            letter-spacing: 1px;
        }

        /* The Compass Wrapper */
        .compass-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: 40px;
        }

        /* Minimal Phone Top Indicator */
        .phone-indicator {
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 12px;
            background: var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 12px var(--gold-glow);
            z-index: 10;
        }

        /* Outer Minimal Ring */
        .compass-outer {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(226, 192, 115, 0.15);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6);
        }

        /* Rotating Dial */
        .compass-dial {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            transition: transform 0.15s linear;
            will-change: transform;
        }

        /* Dotted Inner Ring */
        .compass-dial::before {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        /* Elegant English Direction Letters */
        .direction {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
        .dir-n { top: 18px; left: 50%; transform: translateX(-50%); color: var(--gold); font-weight: 600; font-size: 22px; text-shadow: 0 0 10px var(--gold-glow);}
        .dir-s { bottom: 18px; left: 50%; transform: translateX(-50%); }
        .dir-e { top: 50%; right: 22px; transform: translateY(-50%); }
        .dir-w { top: 50%; left: 22px; transform: translateY(-50%); }

        /* Qibla Target (Kaaba SVG) */
        .qibla-target {
            position: absolute;
            width: 100%; height: 100%;
            /* Bouncy, premium animation feeling */
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        
        .target-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* Hollow / Transparent Start Button */
        .start-btn {
            background: rgba(226, 192, 115, 0.05);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 500;
            font-family: 'Anek Gujarati', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        .start-btn:hover {
            background: var(--gold);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--gold-glow);
        }
        .start-btn:active {
            transform: scale(0.95);
        }

        /* Info Display */
        .status-panel {
            display: none;
            width: 100%;
            text-align: center;
        }
        .angle-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 300;
            color: #fff;
            margin-bottom: 0px;
        }
        .angle-display span {
            font-size: 15px;
            font-family: 'Anek Gujarati', sans-serif;
            color: var(--gold);
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        
        /* Debug Error Box */
        #error-box {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 20px;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="header-title">કિબલા દર્શન</h1>
        <p class="header-sub">પ્રીમિયમ ડિજિટલ કંપાસ</p>

        <div class="compass-wrapper">
            <!-- Indicator for top of the phone -->
            <div class="phone-indicator"></div>
            
            <div class="compass-outer"></div>
            
            <!-- Dial that rotates to keep N at North -->
            <div class="compass-dial" id="dial">
                <div class="direction dir-n">N</div>
                <div class="direction dir-e">E</div>
                <div class="direction dir-s">S</div>
                <div class="direction dir-w">W</div>
                
                <!-- Minimalist Qibla Target relative to North -->
                <div class="qibla-target" id="qiblaPointer">
                    <svg class="target-svg" viewBox="0 0 260 260">
                        <!-- Center glowing dot -->
                        <circle cx="130" cy="130" r="4.5" fill="#e2c073" filter="drop-shadow(0 0 6px #e2c073)"/>
                        
                        <!-- Dotted line to Kaaba -->
                        <line x1="130" y1="120" x2="130" y2="45" stroke="#e2c073" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
                        
                        <!-- Modern outline Kaaba Icon at the tip -->
                        <rect x="117" y="16" width="26" height="26" fill="#0b0f19" stroke="#e2c073" stroke-width="1.5" rx="3"/>
                        <rect x="117" y="24" width="26" height="1.5" fill="#e2c073"/>
                    </svg>
                </div>
            </div>
        </div>

        <button class="start-btn" id="startBtn" onclick="initCompass()">ચાલુ કરો</button>

        <!-- Dynamic Data Text -->
        <div class="status-panel" id="statusPanel">
            <div class="angle-display" id="qiblaText">0.0° <br><span>કિબલા એંગલ</span></div>
        </div>

        <!-- Error Messages -->
        <div id="error-box"></div>
    </div>

    <script>
        const MECCA_LAT = 21.422487;
        const MECCA_LON = 39.826206;
        let qiblaAngle = 0;

        function showError(msg) {
            const dbg = document.getElementById('error-box');
            dbg.style.display = 'block';
            dbg.innerHTML = "<b>ક્ષમા કરશો:</b><br>" + msg;
        }

        function initCompass() {
            if (window.isSecureContext === false) {
                showError("મોબાઇલ સેન્સર વાપરવા માટે આ વેબસાઇટ સુરક્ષિત (HTTPS/SSL) હોવી ફરજિયાત છે.");
                return;
            }

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('statusPanel').style.display = 'block';
            document.getElementById('qiblaText').innerHTML = "...<br><span>લોકેશન એક્સેસ ચેક થાય છે</span>";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    calculateQibla(lat, lon);
                    requestOrientation();
                }, error => {
                    showError("તમારા મોબાઇલમાં લોકેશન (GPS) બંધ છે અથવા પરવાનગી નથી આપી.");
                    document.getElementById('startBtn').style.display = 'block';
                    document.getElementById('statusPanel').style.display = 'none';
                }, { enableHighAccuracy: true });
            } else {
                showError("લોકેશન સપોર્ટ નથી કરતું.");
            }
        }

        function calculateQibla(lat, lon) {
            const PI = Math.PI;
            const latK = MECCA_LAT * (PI / 180);
            const lonK = MECCA_LON * (PI / 180);
            const latU = lat * (PI / 180);
            const lonU = lon * (PI / 180);
            
            const y = Math.sin(lonK - lonU) * Math.cos(latK);
            const x = Math.cos(latU) * Math.sin(latK) - Math.sin(latU) * Math.cos(latK) * Math.cos(lonK - lonU);
            
            let qibla = Math.atan2(y, x) * (180 / PI);
            qiblaAngle = (qibla + 360) % 360;
            
            document.getElementById('qiblaText').innerHTML = qiblaAngle.toFixed(1) + "° <br><span>તમારા લોકેશનથી મક્કાની દિશા</span>";
            document.getElementById('qiblaPointer').style.transform = `rotate(${qiblaAngle}deg)`;
        }

        function requestOrientation() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        } else {
                            showError("કંપાસ સેન્સર વાપરવાની પરવાનગી નકારી કાઢવામાં આવી છે.");
                        }
                    })
                    .catch(err => showError(err));
            } else {
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }
        }

        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading;
            } else if (event.absolute === true && event.alpha !== null) {
                heading = 360 - event.alpha; 
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha;
            }
            
            if (heading !== null) {
                document.getElementById('dial').style.transform = `rotate(${-heading}deg)`;
            }
        }
    </script>
</body>
</html>
    <script>
        // Dropdown Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('menuToggleBtn');
            const menuContainer = document.getElementById('menuItemsContainer');
            if(toggleBtn && menuContainer) {
                toggleBtn.addEventListener('click', () => {
                    menuContainer.classList.toggle('show');
                });
            }
        });
    </script>
</body>
</html>
