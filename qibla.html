<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સ્માર્ટ કિબલા કંપાસ - પ્રોફેશનલ</title>
    
    <!-- Google Fonts: Baloo Bhai 2 (Gujarati), Poppins (English numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.7); 
            --primary: #10b981; 
            --gold: #fbbf24; 
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Baloo Bhai 2', cursive, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(251, 191, 36, 0.1) 0%, transparent 60%);
        }
        
        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 35px 25px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        
        h1 {
            color: var(--gold);
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.2;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        
        .instructions {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
            font-size: 19px;
            line-height: 1.5;
            color: #d1fae5;
        }
        .instructions p {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
        }
        .instructions p:last-child { margin-bottom: 0; }
        .instructions i {
            color: var(--primary);
            font-size: 18px;
            margin-top: 6px;
            margin-right: 15px;
            width: 25px;
            text-align: center;
        }
        
        .compass-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            background: #0f172a;
            border: 4px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.9);
            display: none; 
        }
        
        .phone-top {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary);
            font-size: 30px;
            z-index: 10;
            filter: drop-shadow(0 -4px 8px rgba(16, 185, 129, 0.6));
        }

        .dial {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            transition: transform 0.15s ease-out; 
            will-change: transform;
        }
        
        .dial::before {
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .dir {
            position: absolute;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.3);
        }
        .n { top: 15px; left: 50%; transform: translateX(-50%); color: #ef4444; font-size: 28px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);}
        .s { bottom: 15px; left: 50%; transform: translateX(-50%); }
        .e { top: 50%; right: 20px; transform: translateY(-50%); }
        .w { top: 50%; left: 20px; transform: translateY(-50%); }
        
        .qibla-layer {
            position: absolute;
            width: 100%; height: 100%;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 35px;
        }
        
        .kaaba-icon {
            color: var(--gold);
            font-size: 45px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.9));
        }
        
        .glowing-line {
            position: absolute;
            top: 85px; left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 45px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            box-shadow: 0 0 8px var(--gold);
            border-radius: 5px;
        }
        
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--gold);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #059669);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 22px;
            font-family: 'Baloo Bhai 2', sans-serif;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.6);
        }
        .btn:active { transform: scale(0.95); }

        .status-box { display: none; margin-top: 25px; }
        .degree-text {
            font-family: 'Poppins', sans-serif;
            font-size: 40px;
            font-weight: 800;
            color: white;
            margin-bottom: -5px;
            line-height: 1;
        }
        .degree-text span {
            font-family: 'Baloo Bhai 2', sans-serif;
            font-size: 19px;
            color: var(--gold);
            font-weight: 600;
            display: block;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            color: #fca5a5;
            padding: 18px;
            border-radius: 15px;
            font-size: 17px;
            margin-top: 20px;
            display: none;
            text-align: left;
            line-height: 1.5;
        }
        .error-box i { font-size: 22px; margin-right: 10px; color: #ef4444; }
    </style>
</head>
<body>

    <div class="card">
        <h1><i class="fa-solid fa-kaaba"></i> સ્માર્ટ કિબલા</h1>
        
        <div class="instructions" id="instructionBox">
            <p><i class="fa-solid fa-location-dot"></i> કૃપા કરીને તમારા ઉપકરણની લોકેશન (GPS) સેવા સક્રિય કરો.</p>
            <p><i class="fa-solid fa-mobile-screen"></i> ચોક્કસ પરિણામો માટે, ડિવાઇસને જમીન સમાંતર (Flat) સ્થિતિમાં રાખો.</p>
            <p><i class="fa-solid fa-satellite-dish"></i> દિશા નિર્ધારણ પ્રક્રિયા શરૂ કરવા માટે નીચે આપેલ બટન પર ક્લિક કરો.</p>
        </div>

        <div class="compass-box" id="compassContainer">
            <i class="fa-solid fa-caret-up phone-top"></i>
            
            <div class="dial" id="dial">
                <div class="dir n">N</div>
                <div class="dir e">E</div>
                <div class="dir s">S</div>
                <div class="dir w">W</div>
                
                <div class="qibla-layer" id="qiblaLayer">
                    <i class="fa-solid fa-kaaba kaaba-icon"></i>
                    <div class="glowing-line"></div>
                </div>
            </div>
            
            <div class="center-dot"></div>
        </div>

        <button class="btn" id="startBtn" onclick="startCompass()">
            <i class="fa-solid fa-compass"></i> સેન્સર સક્રિય કરો
        </button>

        <div class="status-box" id="statusBox">
            <div class="degree-text" id="angleText">... <span>લોકેશન ડેટા પ્રોસેસિંગ...</span></div>
        </div>

        <div class="error-box" id="errorBox"></div>
    </div>

    <script>
        const MECCA_LAT = 21.422487;
        const MECCA_LON = 39.826206;
        let qiblaAngle = 0;
        let isAbsolute = false;

        function showError(msg) {
            const err = document.getElementById('errorBox');
            err.style.display = 'block';
            err.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <b>સિસ્ટમ એરર:</b> <br> ${msg}`;
        }

        function startCompass() {
            if (window.isSecureContext === false) {
                showError("સુરક્ષા પ્રોટોકોલ ભૂલ: સેન્સર એક્સેસ કરવા માટે વેબસાઈટ સુરક્ષિત કનેક્શન (HTTPS) પર હોવી આવશ્યક છે.");
                return;
            }

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('instructionBox').style.display = 'none';
            document.getElementById('compassContainer').style.display = 'block';
            document.getElementById('statusBox').style.display = 'block';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    calculateQibla(lat, lon);
                    initSensor();
                }, error => {
                    showError("જીઓલોકેશન એક્સેસ નિષ્ફળ! કૃપા કરીને મોબાઇલમાં લોકેશન (GPS) ચાલુ કરો અને બ્રાઉઝરને પરવાનગી આપો.");
                    document.getElementById('compassContainer').style.display = 'none';
                    document.getElementById('statusBox').style.display = 'none';
                    document.getElementById('startBtn').style.display = 'flex';
                }, { enableHighAccuracy: true });
            } else {
                showError("તમારું બ્રાઉઝર જીઓલોકેશન API ને સપોર્ટ કરતું નથી.");
            }
        }

        function calculateQibla(lat, lon) {
            const PI = Math.PI;
            const latK = MECCA_LAT * (PI / 180);
            const lonK = MECCA_LON * (PI / 180);
            const latU = lat * (PI / 180);
            const lonU = lon * (PI / 180);
            
            const y = Math.sin(lonK - lonU) * Math.cos(latK);
            const x = Math.cos(latU) * Math.sin(latK) - Math.sin(latU) * Math.cos(latK) * Math.cos(lonK - lonU);
            
            let qibla = Math.atan2(y, x) * (180 / PI);
            qiblaAngle = (qibla + 360) % 360;
            
            document.getElementById('angleText').innerHTML = `${qiblaAngle.toFixed(0)}° <span>કિબલા એંગલ (Qibla Angle)</span>`;
            document.getElementById('qiblaLayer').style.transform = `rotate(${qiblaAngle}deg)`;
        }

        function applyHeading(heading) {
            document.getElementById('dial').style.transform = `rotate(${-heading}deg)`;
        }

        function initSensor() {
            // પદ્ધતિ 1: Modern Android Chrome (AbsoluteOrientationSensor API)
            // આ સીધું હાર્ડવેર લેવલ પરથી મેગ્નેટોમીટર વાંચે છે. બ્રાઉઝરની ખામીઓને બાયપાસ કરે છે.
            if ('AbsoluteOrientationSensor' in window) {
                try {
                    const sensor = new AbsoluteOrientationSensor({ frequency: 60 });
                    sensor.addEventListener('reading', () => {
                        isAbsolute = true;
                        const q = sensor.quaternion;
                        // Quaternion [X, Y, Z, W] ને Heading (Yaw) માં ફેરવવાનું ગણિત
                        const x = q[0], y = q[1], z = q[2], w = q[3];
                        let heading = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z)) * (180 / Math.PI);
                        
                        if (heading < 0) heading += 360;
                        applyHeading(heading);
                    });
                    sensor.addEventListener('error', (error) => {
                        startLegacySensor(); 
                    });
                    sensor.start();
                    return; 
                } catch (e) {
                    startLegacySensor();
                }
            } else {
                startLegacySensor();
            }
        }

        function startLegacySensor() {
            // પદ્ધતિ 2: Apple iPhone (webkitCompassHeading)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', (event) => {
                                if (event.webkitCompassHeading !== undefined) {
                                    isAbsolute = true;
                                    applyHeading(event.webkitCompassHeading);
                                }
                            }, true);
                        } else {
                            showError("ડિવાઇસ ઓરિએન્ટેશન સેન્સરની પરવાનગી નકારવામાં આવી છે.");
                        }
                    })
                    .catch(err => showError(`સેન્સર એક્સેસ નિષ્ફળ: ${err}`));
            } 
            // પદ્ધતિ 3: જૂના Android અને અન્ય બ્રાઉઝર
            else {
                window.addEventListener('deviceorientationabsolute', (event) => {
                    if (event.alpha !== null) {
                        isAbsolute = true;
                        applyHeading(360 - event.alpha);
                    }
                }, true);

                window.addEventListener('deviceorientation', (event) => {
                    // જો absolute orientation સાચું હોય તો જ આ ડેટા લેવો
                    if (!isAbsolute && event.absolute === true && event.alpha !== null) {
                        isAbsolute = true;
                        applyHeading(360 - event.alpha);
                    }
                }, true);
                
                // ટાઈમઆઉટ ચેક (જો બ્રાઉઝર મેગ્નેટિક સેન્સર બ્લોક કરતું હોય તો)
                setTimeout(() => {
                    if (!isAbsolute) {
                        showError("હાર્ડવેર અથવા બ્રાઉઝર મર્યાદા: મેગ્નેટોમીટર (અસલી ઉત્તર દિશા) નો ડેટા પ્રાપ્ત થઈ રહ્યો નથી. કંપાસ ફરી નહિ શકે.");
                    }
                }, 4000);
            }
        }
    </script>
</body>
</html>

    <script>
        // Dropdown Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('menuToggleBtn');
            const menuContainer = document.getElementById('menuItemsContainer');
            if(toggleBtn && menuContainer) {
                toggleBtn.addEventListener('click', () => {
                    menuContainer.classList.toggle('show');
                });
            }
        });
    </script>
</body>
</html>
