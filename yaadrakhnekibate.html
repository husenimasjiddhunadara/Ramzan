      { id: 98, guNum: "૯૮", cat: "akhlaq", title: "હસદ ઔર રશ્ક", desc: "કિસી કી નેઅમત દેખકર યે તમન્ના કરના કે ઉસસે વો નેઅમત છિન જાએ, ઉસે 'હસદ' કહતે હૈં (યે હરામ હૈ); ઔર યે તમન્ના કરના કે ઉસકી નેઅમત બાકી રહે ઔર મુઝે ભી વૈસી મિલ જાએ, ઉસે 'રશ્ક' કહતે હૈં (યે જાઈઝ હૈ, ઔર દીની મામલે મેં અચ્છા હૈ)." },
      { id: 99, guNum: "૯૯", cat: "akhlaq", title: "સૂદ (રિબા)", desc: "કર્ઝ યા તિજારત મેં બગૈર કિસી શરઈ ઇવઝ (બદલે) કે લિયા યા દિયા જાને વાલા ઝાઈદ નફા સૂદ કહલાતા હૈ; સૂદ લેના, દેના, લિખના ઔર ઉસ પર ગવાહ બનના સબ હરામ-એ-કતઈ ઔર ગુનાહે કબીરા હૈ." },
      { id: 100, guNum: "૧૦૦", cat: "akhlaq", title: "હુકૂકુલ્લાહ ઔર હુકૂકુલ-ઇબાદ", desc: "વો ફરાઈઝ ઔર હક જિનકા તાલ્લુક સિર્ફ અલ્લાહ તઆલા સે હૈ (જૈસે નમાઝ, રોઝા) ઉન્હેં 'હુકૂકુલ્લાહ' કહતે હૈં (જિન્હેં અલ્લાહ ચાહે તો તૌબા યા અપને ફઝ્લ સે માફ ફરમા દે), ઔર વો હક જિનકા તાલ્લુક બંદોં સે હૈ (જૈસે વાલિદૈન કા હક, કર્ઝ, કિસી કા દિલ દુખાના યા માલ ખાના) ઉન્હેં 'હુકૂકુલ-ઇબાદ' કહતે હૈં (યે જબ તક ઉસ બંદે સે માફ ન કરાએ જાએં, માફ નહીં હોતે)." }
    ];

    const guDigits = ["૦", "૧", "૨", "૩", "૪", "૫", "૬", "૭", "૮", "૯"];
    function toGuNum(num) {
      return String(num).replace(/\d/g, (d) => guDigits[Number(d)]);
    }

    function normalizeDigitsToAscii(str) {
      return String(str).replace(/[૦-૯]/g, (ch) => String(guDigits.indexOf(ch)));
    }

    // State
    let activeCategory = "all";
    let showSavedOnly = false;
    let searchQuery = "";
    let fontScale = 1;
    let savedIds = new Set();
    let toastTimer = null;

    // Elements
    const vibhagGrid = document.getElementById("vibhagGrid");
    const vibhagSection = document.getElementById("vibhagSection");
    const toolbarWrap = document.getElementById("toolbarWrap");
    const cardsList = document.getElementById("cardsList");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const savedFilterBtn = document.getElementById("savedFilterBtn");
    const savedCountBadge = document.getElementById("savedCountBadge");
    const dockSavedBadge = document.getElementById("dockSavedBadge");
    const resultsHeading = document.getElementById("resultsHeading");
    const resultsPill = document.getElementById("resultsPill");
    const resetFilterBtn = document.getElementById("resetFilterBtn");
    const topBtn = document.getElementById("topBtn");
    const toastEl = document.getElementById("toast");
    const metaThemeColor = document.getElementById("metaThemeColor");
    const readProgressFill = document.getElementById("readProgressFill");

    const themeButtons = document.querySelectorAll("[data-theme-val]");
    const fontValDesktop = document.getElementById("fontValDesktop");
    const fontValSheet = document.getElementById("fontValSheet");

    // Mobile Dock & Sheet
    const dockVibhag = document.getElementById("dockVibhag");
    const dockSearch = document.getElementById("dockSearch");
    const dockSaved = document.getElementById("dockSaved");
    const dockSettings = document.getElementById("dockSettings");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const settingsSheet = document.getElementById("settingsSheet");
    const sheetCloseBtn = document.getElementById("sheetCloseBtn");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2200);
    }

    // Theme Management
    function applyTheme(themeName) {
      if (!/^theme-[1-5]$/.test(themeName)) return;
      document.documentElement.setAttribute("data-theme", themeName);
      if (metaThemeColor && themeMetaColors[themeName]) {
        metaThemeColor.setAttribute("content", themeMetaColors[themeName]);
      }
      themeButtons.forEach((btn) => {
        const isMatch = btn.dataset.themeVal === themeName;
        btn.classList.toggle("active", isMatch);
        btn.setAttribute("aria-pressed", String(isMatch));
      });
      try {
        localStorage.setItem("islamicSiteThemeV3", themeName);
      } catch (e) {}
    }

    themeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        applyTheme(btn.dataset.themeVal);
      });
    });

    // Font Scale Management
    function applyFontScale(scale) {
      const clamped = Math.min(1.25, Math.max(0.88, Math.round(scale * 100) / 100));
      fontScale = clamped;
      document.documentElement.style.setProperty("--font-scale", String(fontScale));
      const pctText = toGuNum(Math.round(fontScale * 100)) + "%";
      fontValDesktop.textContent = pctText;
      fontValSheet.textContent = pctText;
      try {
        localStorage.setItem("islamicSiteFontScale", String(fontScale));
      } catch (e) {}
    }

    function changeFontScale(delta) {
      applyFontScale(fontScale + delta);
    }

    document.getElementById("fontDecDesktop").addEventListener("click", () => changeFontScale(-0.06));
    document.getElementById("fontIncDesktop").addEventListener("click", () => changeFontScale(0.06));
    document.getElementById("fontDecSheet").addEventListener("click", () => changeFontScale(-0.06));
    document.getElementById("fontIncSheet").addEventListener("click", () => changeFontScale(0.06));

    // Bookmarks Storage
    function loadSavedIds() {
      try {
        const raw = localStorage.getItem("islamicSiteSavedIds");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            savedIds = new Set(parsed.filter((n) => Number.isInteger(n)));
          }
        }
      } catch (e) {}
    }

    function persistSavedIds() {
      try {
        localStorage.setItem("islamicSiteSavedIds", JSON.stringify([...savedIds]));
      } catch (e) {}
    }

    function updateSavedBadges() {
      const count = savedIds.size;
      const guCount = toGuNum(count);
      savedCountBadge.textContent = guCount;
      dockSavedBadge.textContent = guCount;
      dockSavedBadge.classList.toggle("visible", count > 0);
      savedFilterBtn.classList.toggle("active", showSavedOnly);
      savedFilterBtn.setAttribute("aria-pressed", String(showSavedOnly));
      dockSaved.classList.toggle("active", showSavedOnly);
      dockVibhag.classList.toggle("active", !showSavedOnly);
    }

    function toggleSaveItem(id) {
      if (savedIds.has(id)) {
        savedIds.delete(id);
        showToast("પસંદીદા માંથી હટાવવામાં આવ્યું");
      } else {
        savedIds.add(id);
        showToast("પસંદીદા માં સાચવવામાં આવ્યું");
      }
      persistSavedIds();
      updateSavedBadges();
      renderItems();
    }

    // Clipboard & Share Utility
    async function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {}
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {}
      document.body.removeChild(textarea);
      return ok;
    }

    function formatItemForShare(item) {
      return `${item.guNum}. ${item.title}\n\n${item.desc}\n\n— કુછ યાદ રખને કી બાતેં (અહલે સુન્નત વલ જમાઅત કે મુતાબિક)`;
    }

    async function handleCopy(item) {
      const copied = await copyTextSafe(formatItemForShare(item));
      showToast(copied ? "કૉપી થઈ ગયું!" : "કૉપી ન થઈ શક્યું");
    }

    async function handleShare(item) {
      const text = formatItemForShare(item);
      if (navigator.share) {
        try {
          await navigator.share({
            title: `${item.guNum}. ${item.title}`,
            text
          });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      const copied = await copyTextSafe(text);
      showToast(copied ? "શેર કરવા માટે કૉપી થઈ ગયું!" : "શેર ન થઈ શક્યું");
    }

    // Safe Text Highlight Helper (No innerHTML XSS)
    function appendHighlightedText(parentEl, text, query) {
      const trimmed = query.trim();
      if (!trimmed) {
        parentEl.textContent = text;
        return;
      }
      const escaped = trimmed.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${escaped})`, "gi");
      const parts = text.split(regex);
      parts.forEach((part, idx) => {
        if (idx % 2 === 1) {
          const mark = document.createElement("mark");
          mark.textContent = part;
          parentEl.appendChild(mark);
        } else if (part) {
          parentEl.appendChild(document.createTextNode(part));
        }
      });
    }

    function getCategoryCount(catId) {
      if (catId === "all") return items.length;
      return items.filter((item) => item.cat === catId).length;
    }

    function renderVibhagCards() {
      vibhagGrid.innerHTML = "";
      const fragment = document.createDocumentFragment();

      categories.forEach((cat) => {
        const count = getCategoryCount(cat.id);
        const isSelected = !showSavedOnly && activeCategory === cat.id;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "vibhag-card" + (isSelected ? " active" : "");
        btn.setAttribute("aria-pressed", String(isSelected));

        btn.innerHTML = `
          <span class="vibhag-top">
            <span class="vibhag-icon" aria-hidden="true">${cat.icon}</span>
            <span class="vibhag-count">${toGuNum(count)} બાતેં</span>
          </span>
          <span class="vibhag-name">${cat.name}</span>
        `;

        btn.addEventListener("click", () => {
          showSavedOnly = false;
          activeCategory = cat.id;
          updateSavedBadges();
          renderVibhagCards();
          renderItems();
        });

        fragment.appendChild(btn);
      });

      vibhagGrid.appendChild(fragment);
    }

    function getFilteredItems() {
      let list = items;

      if (showSavedOnly) {
        list = list.filter((item) => savedIds.has(item.id));
      } else if (activeCategory !== "all") {
        list = list.filter((item) => item.cat === activeCategory);
      }

      const rawQ = searchQuery.trim();
      if (rawQ) {
        const qLower = rawQ.toLowerCase();
        const qAscii = normalizeDigitsToAscii(rawQ);
        list = list.filter((item) => {
          const idStr = String(item.id);
          const catName = categoryNameMap[item.cat] || "";
          return (
            item.title.toLowerCase().includes(qLower) ||
            item.desc.toLowerCase().includes(qLower) ||
            catName.toLowerCase().includes(qLower) ||
            item.guNum.includes(rawQ) ||
            idStr === qAscii ||
            idStr.includes(qAscii)
          );
        });
      }

      return list;
    }

    function renderItems() {
      cardsList.innerHTML = "";
      const filteredItems = getFilteredItems();

      // Update Header & Result Meta
      const hasSearch = searchQuery.trim().length > 0;
      if (showSavedOnly) {
        resultsHeading.textContent = "પસંદીદા બાતેં";
      } else {
        resultsHeading.textContent = categoryNameMap[activeCategory] || "તમામ હિસ્સે";
      }

      resultsPill.textContent = hasSearch
        ? `${toGuNum(filteredItems.length)} પરિણામ`
        : `${toGuNum(filteredItems.length)} બાતેં`;

      resetFilterBtn.classList.toggle(
        "visible",
        showSavedOnly || hasSearch || activeCategory !== "all"
      );

      if (filteredItems.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `
          <div class="empty-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <h3 class="empty-title">${showSavedOnly ? "હજી કોઈ વાત પસંદીદામાં સાચવી નથી" : "કોઈ પરિણામ મળ્યું નથી"}</h3>
          <p class="empty-desc">${
            showSavedOnly
              ? "કોઈ પણ કાર્ડ પર 'સાચવો' બટન દબાવીને તમારી પસંદીદા યાદી બનાવી શકો છો."
              : "કૃપા કરીને બીજો શબ્દ અથવા નંબર લખીને શોધો."
          }</p>
          <button type="button" class="empty-btn" id="emptyResetBtn">તમામ ૧૦૦ બાતેં બતાવો</button>
        `;
        cardsList.appendChild(empty);
        document.getElementById("emptyResetBtn").addEventListener("click", resetAllFilters);
        return;
      }

      const fragment = document.createDocumentFragment();

      filteredItems.forEach((item) => {
        const isSaved = savedIds.has(item.id);

        const card = document.createElement("article");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";

        const badge = document.createElement("span");
        badge.className = "num-badge";
        badge.textContent = item.guNum;

        const title = document.createElement("h3");
        title.className = "card-title";
        appendHighlightedText(title, item.title, searchQuery);

        header.appendChild(badge);
        header.appendChild(title);

        const body = document.createElement("p");
        body.className = "card-body";
        appendHighlightedText(body, item.desc, searchQuery);

        const footer = document.createElement("div");
        footer.className = "card-footer";

        const catChip = document.createElement("span");
        catChip.className = "card-cat-chip";
        catChip.innerHTML = `<span class="card-cat-dot" aria-hidden="true"></span><span>${categoryNameMap[item.cat] || ""}</span>`;

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "card-action-btn" + (isSaved ? " saved" : "");
        saveBtn.setAttribute("aria-pressed", String(isSaved));
        saveBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>${isSaved ? "સાચવેલ" : "સાચવો"}</span>
        `;
        saveBtn.addEventListener("click", () => toggleSaveItem(item.id));

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "card-action-btn";
        copyBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>કૉપી</span>
        `;
        copyBtn.addEventListener("click", () => handleCopy(item));

        const shareBtn = document.createElement("button");
        shareBtn.type = "button";
        shareBtn.className = "card-action-btn";
        shareBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>શેર</span>
        `;
        shareBtn.addEventListener("click", () => handleShare(item));

        actions.appendChild(saveBtn);
        actions.appendChild(copyBtn);
        actions.appendChild(shareBtn);

        footer.appendChild(catChip);
        footer.appendChild(actions);

        card.appendChild(header);
        card.appendChild(body);
        card.appendChild(footer);
        fragment.appendChild(card);
      });

      cardsList.appendChild(fragment);
    }

    function resetAllFilters() {
      activeCategory = "all";
      showSavedOnly = false;
      searchQuery = "";
      searchInput.value = "";
      searchClearBtn.classList.remove("visible");
      updateSavedBadges();
      renderVibhagCards();
      renderItems();
    }

    // Search Input Handler
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      searchClearBtn.classList.toggle("visible", searchQuery.length > 0);
      renderItems();
    });

    searchClearBtn.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      searchClearBtn.classList.remove("visible");
      searchInput.focus();
      renderItems();
    });

    // Saved Toggle Handlers
    function toggleSavedFilter() {
      showSavedOnly = !showSavedOnly;
      updateSavedBadges();
      renderVibhagCards();
      renderItems();
      if (showSavedOnly) {
        toolbarWrap.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    savedFilterBtn.addEventListener("click", toggleSavedFilter);
    resetFilterBtn.addEventListener("click", resetAllFilters);

    // Bottom Sheet Logic
    function openSheet() {
      sheetBackdrop.classList.add("open");
      settingsSheet.classList.add("open");
      sheetBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeSheet() {
      sheetBackdrop.classList.remove("open");
      settingsSheet.classList.remove("open");
      sheetBackdrop.setAttribute("aria-hidden", "true");
    }

    dockSettings.addEventListener("click", openSheet);
    sheetCloseBtn.addEventListener("click", closeSheet);
    sheetBackdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSheet();
    });

    // Mobile Dock Actions
    dockVibhag.addEventListener("click", () => {
      if (showSavedOnly) {
        showSavedOnly = false;
        updateSavedBadges();
        renderVibhagCards();
        renderItems();
      }
      vibhagSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    dockSearch.addEventListener("click", () => {
      toolbarWrap.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(() => {
        searchInput.focus();
      }, 280);
    });

    dockSaved.addEventListener("click", toggleSavedFilter);

    // Scroll Progress & Top Button (RAF Throttled for 60fps)
    let scrollTicking = false;
    function onScrollUpdate() {
      scrollTicking = false;
      const scrollY = window.scrollY || window.pageYOffset;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = maxScroll > 0 ? Math.min(1, Math.max(0, scrollY / maxScroll)) : 0;
      readProgressFill.style.transform = `scaleX(${progress})`;
      topBtn.classList.toggle("show", scrollY > 360);
    }

    window.addEventListener("scroll", () => {
      if (!scrollTicking) {
        scrollTicking = true;
        requestAnimationFrame(onScrollUpdate);
      }
    }, { passive: true });

    topBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Init Stored Preferences
    try {
      const savedTheme = localStorage.getItem("islamicSiteThemeV3") || localStorage.getItem("islamicSiteThemeV2");
      if (savedTheme && /^theme-[1-5]$/.test(savedTheme)) {
        applyTheme(savedTheme);
      }
      const savedScale = parseFloat(localStorage.getItem("islamicSiteFontScale"));
      if (!Number.isNaN(savedScale)) {
        applyFontScale(savedScale);
      }
    } catch (e) {}

    loadSavedIds();
    updateSavedBadges();
    renderVibhagCards();
    renderItems();
    onScrollUpdate();
  </script>
</body>
</html>
