<!DOCTYPE html>
<html lang="gu" data-theme="theme-1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d1e07" id="metaThemeColor" />
  <title>કુછ યાદ રખને કી બાતેં - અહલે સુન્નત વલ જમાઅત</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Rasa:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       5 NEXT-GEN LUXURY ISLAMIC THEMES
       ========================================================= */
    :root,
    [data-theme="theme-1"] {
      --font-scale: 1;
      --primary-dark: #160e03;
      --primary: #2d1e07;
      --primary-mid: #4b330c;
      --gold: #d6af3b;
      --gold-bright: #fce69f;

      --gold-soft: rgba(214, 175, 59, 0.15);

      --gold-glow: rgba(214, 175, 59, 0.34);
      --mehrab-fill: rgba(22, 14, 3, 0.84);
      --mehrab-fill-deep: rgba(14, 8, 2, 0.94);
      --bg: #faf4e6;
      --bg-accent: #f1e5ca;
      --surface: #fffdf8;
      --surface-elevated: #ffffff;
      --surface-tint: #fbf5e7;
      --glass-dock: rgba(255, 252, 244, 0.86);
      --glass-dark: rgba(22, 14, 3, 0.92);
      --glass-highlight: rgba(255, 255, 255, 0.88);
      --text: #241a0b;
      --muted: #6c5733;
      --border: rgba(196, 163, 92, 0.42);
      --card-title: #3c2807;
      --mark-bg: rgba(214, 175, 59, 0.34);
      --mark-text: #1c1203;
      --shadow: rgba(66, 46, 10, 0.08);
      --shadow-hover: rgba(66, 46, 10, 0.16);
      --pattern-color: rgba(168, 127, 34, 0.06);
      --danger-soft: rgba(214, 65, 65, 0.12);
    }

    [data-theme="theme-2"] {
      --primary-dark: #031a13;
      --primary: #073326;
      --primary-mid: #0f523e;
      --gold: #d6b03d;
      --gold-bright: #fae49c;
      --gold-deep: #9c771c;
      --gold-soft: rgba(214, 176, 61, 0.15);
      --gold-border: rgba(214, 176, 61, 0.48);
      --gold-glow: rgba(214, 176, 61, 0.32);
      --mehrab-fill: rgba(3, 26, 19, 0.84);
      --mehrab-fill-deep: rgba(2, 17, 12, 0.94);
      --bg: #f3f1e7;
      --bg-accent: #e5ede7;
      --surface: #fcfdfb;
      --surface-elevated: #ffffff;
      --surface-tint: #f3f8f5;
      --glass-dock: rgba(248, 252, 249, 0.88);
      --glass-dark: rgba(4, 24, 18, 0.92);
      --glass-highlight: rgba(255, 255, 255, 0.88);
      --text: #15221d;
      --muted: #4b6158;
      --border: rgba(173, 162, 120, 0.45);
      --card-title: #073326;
      --mark-bg: rgba(214, 176, 61, 0.34);
      --mark-text: #062118;
      --shadow: rgba(4, 33, 24, 0.08);
      --shadow-hover: rgba(4, 33, 24, 0.16);
      --pattern-color: rgba(11, 79, 59, 0.055);
    }

    [data-theme="theme-3"] {
      --primary-dark: #050f22;
      --primary: #0d2142;
      --primary-mid: #17376b;
      --gold: #dcb653;
      --gold-bright: #fae6a8;
      --gold-deep: #9f7c23;
      --gold-soft: rgba(220, 182, 83, 0.15);
      --gold-border: rgba(220, 182, 83, 0.48);
      --gold-glow: rgba(220, 182, 83, 0.32);
      --mehrab-fill: rgba(6, 15, 34, 0.84);
      --mehrab-fill-deep: rgba(4, 10, 24, 0.94);
      --bg: #f1f3f8;
      --bg-accent: #e4eaf5;
      --surface: #fbfcff;
      --surface-elevated: #ffffff;
      --surface-tint: #f2f5fc;
      --glass-dock: rgba(247, 250, 255, 0.88);
      --glass-dark: rgba(6, 16, 35, 0.92);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --text: #131f33;
      --muted: #4d5e7a;
      --border: rgba(162, 174, 198, 0.48);
      --card-title: #0c2144;
      --mark-bg: rgba(220, 182, 83, 0.35);
      --mark-text: #08152b;
      --shadow: rgba(7, 18, 38, 0.08);
      --shadow-hover: rgba(7, 18, 38, 0.16);
      --pattern-color: rgba(17, 45, 92, 0.05);
    }

    [data-theme="theme-4"] {
      --primary-dark: #21050e;
      --primary: #400a1b;
      --primary-mid: #63132b;
      --gold: #dcb252;
      --gold-bright: #fae3a4;
      --gold-deep: #9c761f;
      --gold-soft: rgba(220, 178, 82, 0.15);
      --gold-border: rgba(220, 178, 82, 0.48);
      --gold-glow: rgba(220, 178, 82, 0.32);
      --mehrab-fill: rgba(31, 5, 13, 0.84);
      --mehrab-fill-deep: rgba(22, 3, 9, 0.94);
      --bg: #faf2f0;
      --bg-accent: #f2e1dd;
      --surface: #fffbfa;
      --surface-elevated: #ffffff;
      --surface-tint: #fcf3f1;
      --glass-dock: rgba(255, 250, 248, 0.88);
      --glass-dark: rgba(30, 5, 13, 0.92);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --text: #291319;
      --muted: #6c4c55;
      --border: rgba(208, 170, 158, 0.5);
      --card-title: #450b1d;
      --mark-bg: rgba(220, 178, 82, 0.35);
      --mark-text: #260710;
      --shadow: rgba(38, 6, 16, 0.08);
      --shadow-hover: rgba(38, 6, 16, 0.16);
      --pattern-color: rgba(102, 21, 45, 0.05);
    }

    [data-theme="theme-5"] {
      --primary-dark: #06070a;
      --primary: #10131a;
      --primary-mid: #1c222e;
      --gold: #e4bd52;
      --gold-bright: #fce8a6;
      --gold-deep: #b08926;
      --gold-soft: rgba(228, 189, 82, 0.16);
      --gold-border: rgba(228, 189, 82, 0.44);
      --gold-glow: rgba(228, 189, 82, 0.3);
      --mehrab-fill: rgba(11, 13, 18, 0.88);
      --mehrab-fill-deep: rgba(7, 8, 12, 0.96);
      --bg: #0b0d12;
      --bg-accent: #121620;
      --surface: #151923;
      --surface-elevated: #1b202d;
      --surface-tint: #191e2a;
      --glass-dock: rgba(19, 23, 33, 0.88);
      --glass-dark: rgba(10, 12, 18, 0.95);
      --glass-highlight: rgba(255, 236, 179, 0.09);
      --text: #efe7d6;
      --muted: #b8aa8d;
      --border: rgba(228, 189, 82, 0.24);
      --card-title: #f6dc8b;
      --mark-bg: rgba(228, 189, 82, 0.32);
      --mark-text: #fff9e6;
      --shadow: rgba(0, 0, 0, 0.46);
      --shadow-hover: rgba(0, 0, 0, 0.68);
      --pattern-color: rgba(228, 189, 82, 0.05);
    }

    /* =========================================================
       RESET, BASE & SCROLLBAR
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overflow-x: clip;
    }

    body {
      font-family: 'Noto Sans Gujarati', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 16%, var(--gold-soft) 0%, transparent 40%),
        radial-gradient(circle at 88% 68%, var(--gold-soft) 0%, transparent 44%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
      color: var(--text);
      line-height: 1.88;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ambient Islamic Lattice Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.72;
      background-image:
        radial-gradient(circle at 50% 50%, var(--pattern-color) 1.4px, transparent 1.5px),
        linear-gradient(45deg, transparent 48.5%, var(--pattern-color) 49.5%, var(--pattern-color) 50.5%, transparent 51.5%),
        linear-gradient(-45deg, transparent 48.5%, var(--pattern-color) 49.5%, var(--pattern-color) 50.5%, transparent 51.5%);
      background-size: 46px 46px;
    }

    ::selection {
      background: var(--gold);
      color: #160e03;
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      border-radius: 999px;
      border: 2px solid var(--bg);
    }

    button,
    input {
      font-family: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* =========================================================
       TOP READING PROGRESS BAR
       ========================================================= */
    .read-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3.5px;
      z-index: 120;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.14);
    }

    .read-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-bright));
      box-shadow: 0 0 10px var(--gold-glow);
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
    }

    /* =========================================================
       KEYFRAME ANIMATIONS
       ========================================================= */
    @keyframes ambientGlow {
      0%, 100% { opacity: 0.72; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    @keyframes emblemRadiate {
      0%, 100% {
        transform: translateX(-50%) translateY(0);
        filter: drop-shadow(0 0 8px var(--gold-glow));
      }
      50% {
        transform: translateX(-50%) translateY(-2.5px);
        filter: drop-shadow(0 0 18px var(--gold-bright));
      }
    }

    @keyframes lanternSway {
      0%, 100% { transform: rotate(-1.6deg); }
      50% { transform: rotate(1.6deg); }
    }

    @keyframes lanternPulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-150%) skewX(-22deg); }
      100% { transform: translateX(270%) skewX(-22deg); }
    }

    /* =========================================================
       ROYAL ISLAMIC HERO & ARCHITECTURAL MEHRAB
       ========================================================= */
    .hero {
      position: relative;
      z-index: 2;
      overflow: hidden;
      background:
        radial-gradient(ellipse 75% 55% at 50% 6%, rgba(252, 230, 159, 0.22) 0%, transparent 65%),
        radial-gradient(circle at 12% 85%, rgba(214, 175, 59, 0.13) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(214, 175, 59, 0.13) 0%, transparent 45%),
        linear-gradient(160deg, var(--primary-dark) 0%, var(--primary) 48%, var(--primary-mid) 100%);
      color: #fffdf7;
      text-align: center;
      padding:
        calc(20px + env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        68px
        max(16px, env(safe-area-inset-left));
      border-bottom: 3px solid var(--gold);
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.34),
        inset 0 -1px 0 rgba(252, 230, 159, 0.42);
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -60px;
      left: 50%;
      width: min(760px, 110vw);
      height: 360px;
      background: radial-gradient(ellipse at center, rgba(252, 230, 159, 0.2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: ambientGlow 7s ease-in-out infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, var(--gold-deep) 18%, var(--gold-bright) 50%, var(--gold-deep) 82%, transparent 100%);
      opacity: 0.92;
      pointer-events: none;
      z-index: 2;
    }

    .hero-islamic-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: var(--gold);
      opacity: 0.19;
      z-index: 0;
      -webkit-mask-image: radial-gradient(ellipse 88% 85% at 50% 45%, #000 38%, rgba(0, 0, 0, 0.25) 100%);
      mask-image: radial-gradient(ellipse 88% 85% at 50% 45%, #000 38%, rgba(0, 0, 0, 0.25) 100%);
    }

    /* =========================================================
       TOP UTILITY BAR (THEME SWITCHER + FONT SIZE CONTROLS)
       ========================================================= */
    .hero-utility-bar {
      position: relative;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 22px;
      max-width: 860px;
    }

    .theme-pill,
    .font-pill {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 7px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.13), rgba(0, 0, 0, 0.46));
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      border: 1px solid var(--gold-border);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 245, 210, 0.28);
      max-width: 100%;
    }

    .theme-label {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: var(--gold-bright);
      text-transform: uppercase;
      user-select: none;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    .theme-dots {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(252, 230, 159, 0.58);
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.38),
        inset 0 2px 3px rgba(255, 255, 255, 0.38);
    }

    .theme-dot::after {
      content: "";
      position: absolute;
      inset: -7px -4px;
      border-radius: 50%;
    }

    .theme-dot:hover {
      transform: translateY(-2px) scale(1.12);
      border-color: var(--gold-bright);
    }

    .theme-dot:active {
      transform: scale(0.92);
    }

    .theme-dot.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow:
        0 0 0 2px var(--gold),
        0 0 14px rgba(252, 230, 159, 0.88),
        inset 0 2px 3px rgba(255, 255, 255, 0.45);
    }

    .dot-1 { background: radial-gradient(circle at 30% 30%, #f5d26c, #573b0b 75%); }
    .dot-2 { background: radial-gradient(circle at 30% 30%, #249c77, #042118 75%); }
    .dot-3 { background: radial-gradient(circle at 30% 30%, #366ec0, #071226 75%); }
    .dot-4 { background: radial-gradient(circle at 30% 30%, #b52a53, #260610 75%); }
    .dot-5 { background: radial-gradient(circle at 30% 30%, #5c6373, #08090c 75%); }

    .font-pill {
      gap: 6px;
      padding: 5px 10px;
    }

    .font-btn {
      min-width: 30px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid rgba(252, 230, 159, 0.32);
      background: rgba(255, 255, 255, 0.08);
      color: #fffbf0;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .font-btn:hover {
      background: rgba(214, 175, 59, 0.26);
      border-color: var(--gold-bright);
    }

    .font-btn:active {
      transform: scale(0.93);
    }

    .font-scale-indicator {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--gold-bright);
      min-width: 40px;
      text-align: center;
      user-select: none;
    }

    /* =========================================================
       ROYAL 3D GOLDEN MEHRAB ARCHITECTURE (ZERO TEXT OVERLAP)
       ========================================================= */
    .mehrab-shell {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      filter: drop-shadow(0 24px 44px rgba(0, 0, 0, 0.46));
    }

    .mehrab-crown-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      z-index: 2;
    }

    .mehrab-crown-svg {
      display: block;
      width: 100%;
      height: clamp(78px, 16vw, 148px);
      overflow: visible;
      color: var(--gold);
    }

    .mehrab-emblem {
      position: absolute;
      left: 50%;
      bottom: clamp(4px, 1.4vw, 10px);
      transform: translateX(-50%);
      color: var(--gold-bright);
      pointer-events: none;
      z-index: 4;
      animation: emblemRadiate 5s ease-in-out infinite;
    }

    .mehrab-emblem svg {
      display: block;
      width: clamp(40px, 8.5vw, 64px);
      height: clamp(40px, 8.5vw, 64px);
    }

    /* Lanterns mathematically guaranteed clear of inner text padding */
    .mehrab-lantern {
      position: absolute;
      top: -10px;
      width: clamp(18px, 4vw, 32px);
      height: clamp(50px, 10vw, 88px);
      pointer-events: none;
      z-index: 3;
      transform-origin: top center;
      animation: lanternSway 6.2s ease-in-out infinite;
      filter: drop-shadow(0 5px 12px rgba(214, 175, 59, 0.34));
    }

    .mehrab-lantern-left {
      left: clamp(8px, 2.5vw, 28px);
    }

    .mehrab-lantern-right {
      right: clamp(8px, 2.5vw, 28px);
      animation-delay: -3.1s;
    }

    .lantern-flame-glow {
      animation: lanternPulse 3.6s ease-in-out infinite;
    }

    .mehrab-capital {
      position: absolute;
      top: -8px;
      width: clamp(16px, 3vw, 24px);
      height: clamp(12px, 2.2vw, 18px);
      pointer-events: none;
      z-index: 4;
    }

    .mehrab-capital-left { left: -5px; }
    .mehrab-capital-right { right: -5px; transform: scaleX(-1); }

    .mehrab-body {
      position: relative;
      z-index: 1;
      margin-top: -2px;
      background: linear-gradient(180deg, var(--mehrab-fill) 0%, var(--mehrab-fill-deep) 100%);
      border-left: 2.5px solid var(--gold);
      border-right: 2.5px solid var(--gold);
      border-bottom: 3px solid var(--gold);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      /* Horizontal padding is strictly greater than lantern offset + width at every screen size */
      padding: clamp(14px, 3vw, 20px) clamp(34px, 9vw, 76px) clamp(24px, 4.5vw, 40px);
      box-shadow:
        inset 0 0 0 7px rgba(214, 175, 59, 0.06),
        inset 0 -30px 48px rgba(214, 175, 59, 0.1),
        inset 12px 0 24px -12px rgba(252, 230, 159, 0.2),
        inset -12px 0 24px -12px rgba(252, 230, 159, 0.2);
    }

    .mehrab-body::before {
      content: "";
      position: absolute;
      inset: 0 9px 9px 9px;
      border-left: 1px solid var(--gold-border);
      border-right: 1px solid var(--gold-border);
      border-bottom: 1px solid var(--gold-border);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      pointer-events: none;
    }

    .mehrab-body::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 66% 52% at 50% 0%, rgba(252, 230, 159, 0.12) 0%, transparent 72%),
        linear-gradient(90deg, rgba(214, 175, 59, 0.08) 0%, transparent 7%, transparent 93%, rgba(214, 175, 59, 0.08) 100%);
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      pointer-events: none;
    }

    .mehrab-corner {
      position: absolute;
      bottom: 12px;
      width: clamp(20px, 4vw, 32px);
      height: clamp(20px, 4vw, 32px);
      color: var(--gold);
      opacity: 0.7;
      pointer-events: none;
      z-index: 2;
    }

    .mehrab-corner-left { left: 13px; }
    .mehrab-corner-right { right: 13px; transform: scaleX(-1); }

    .hero h1 {
      position: relative;
      z-index: 3;
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: clamp(1.72rem, 5.6vw, 3.8rem);
      font-weight: 700;
      line-height: 1.54;
      letter-spacing: 0.3px;
      color: #fffbf0;
      padding: 6px 4px 2px;
      margin-bottom: 4px;
      text-wrap: balance;
      overflow-wrap: break-word;
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.72),
        0 6px 18px rgba(0, 0, 0, 0.48),
        0 0 26px rgba(214, 175, 59, 0.4);
    }

    .subtitle {
      position: relative;
      z-index: 3;
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: clamp(0.98rem, 2.8vw, 1.56rem);
      font-weight: 600;
      color: var(--gold-bright);
      line-height: 1.6;
      margin-bottom: 18px;
      text-wrap: balance;
      overflow-wrap: break-word;
      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.58),
        0 0 14px rgba(214, 175, 59, 0.25);
    }

    .ornament-divider {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 20px;
      max-width: min(320px, 78%);
    }

    .ornament-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, var(--gold-deep) 20%, var(--gold-bright) 85%, #fff8dc 100%);
      opacity: 0.92;
    }

    .ornament-line:last-child {
      background: linear-gradient(270deg, transparent 0%, var(--gold-deep) 20%, var(--gold-bright) 85%, #fff8dc 100%);
    }

    .ornament-diamond {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #fffbe6, var(--gold-bright), var(--gold));
      transform: rotate(45deg);
      box-shadow:
        0 0 14px var(--gold-bright),
        0 0 0 3px rgba(214, 175, 59, 0.25);
    }

    .dev-credit {
      position: relative;
      z-index: 3;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.62rem, 2vw, 0.88rem);
      font-weight: 700;
      letter-spacing: clamp(0.9px, 0.4vw, 2.2px);
      line-height: 1.45;
      color: #fffbf0;
      border: 1.5px solid var(--gold);
      background: linear-gradient(135deg, rgba(214, 175, 59, 0.28), rgba(0, 0, 0, 0.5));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px clamp(14px, 4vw, 26px);
      border-radius: 999px;
      text-transform: uppercase;
      text-wrap: balance;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 246, 214, 0.4);
    }

    .dev-credit::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 248, 220, 0.3), transparent);
      animation: shimmerSweep 5.5s ease-in-out infinite;
      pointer-events: none;
    }

    /* =========================================================
       MAIN CONTAINER
       ========================================================= */
    .container {
      position: relative;
      z-index: 3;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 max(16px, env(safe-area-inset-right)) 72px max(16px, env(safe-area-inset-left));
    }

    /* =========================================================
       FLOATING GLASSMORPHISM VIBHAG CATEGORY DOCK
       (Zero Absolute Overlap - Clean Flexbox Structure)
       ========================================================= */
    .vibhag-section {
      scroll-margin-top: 20px;
    }

    .vibhag-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
      margin: -34px auto 24px;
      padding: 15px;
      border-radius: 24px;
      background: var(--glass-dock);
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
      border: 1px solid var(--border);
      box-shadow:
        0 20px 44px var(--shadow),
        0 2px 10px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 var(--glass-highlight);
    }

    .vibhag-card {
      position: relative;
      background: linear-gradient(155deg, var(--surface-elevated) 0%, var(--surface-tint) 100%);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 14px 14px 15px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      touch-action: manipulation;
      box-shadow:
        0 4px 14px var(--shadow),
        inset 0 1px 0 var(--glass-highlight);
      transition:
        transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    .vibhag-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.72;
      transition: left 0.22s ease, right 0.22s ease, opacity 0.22s ease;
    }

    .vibhag-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow:
        0 12px 26px var(--shadow-hover),
        0 0 0 1px var(--gold-soft);
    }

    .vibhag-card:hover::before {
      left: 8px;
      right: 8px;
      opacity: 1;
    }

    .vibhag-card:active {
      transform: scale(0.97);
    }

    .vibhag-card.active {
      background: linear-gradient(140deg, var(--primary-mid) 0%, var(--primary) 54%, var(--primary-dark) 100%);
      border-color: var(--gold);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.26),
        0 0 0 1px rgba(252, 230, 159, 0.35),
        inset 0 1px 0 rgba(255, 245, 210, 0.25);
    }

    .vibhag-card.active::before {
      left: 0;
      right: 0;
      height: 3.5px;
      border-radius: 17px 17px 0 0;
      background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright), var(--gold-deep));
      opacity: 1;
    }

    .vibhag-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .vibhag-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--gold-soft), rgba(214, 175, 59, 0.05));
      border: 1px solid var(--gold-border);
      color: var(--gold-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.22s ease, background 0.22s ease, color 0.22s ease;
    }

    [data-theme="theme-5"] .vibhag-icon {
      color: var(--gold-bright);
    }

    .vibhag-card.active .vibhag-icon {
      background: linear-gradient(145deg, rgba(252, 230, 159, 0.24), rgba(214, 175, 59, 0.12));
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }

    .vibhag-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.35;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--card-title);
      border: 1px solid var(--gold-border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vibhag-card.active .vibhag-count {
      background: rgba(252, 230, 159, 0.2);
      color: var(--gold-bright);
      border-color: rgba(252, 230, 159, 0.48);
    }

    .vibhag-name {
      display: block;
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--card-title);
      line-height: 1.44;
      padding-top: 1px;
      overflow-wrap: break-word;
      width: 100%;
    }

    .vibhag-card.active .vibhag-name {
      color: #fffbf0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    /* =========================================================
       COMMAND TOOLBAR (SEARCH + BOOKMARK FILTER + ACTIVE META)
       ========================================================= */
    .toolbar-wrap {
      max-width: 960px;
      margin: 0 auto 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-margin-top: 16px;
    }

    .search-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      color: var(--muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input {
      width: 100%;
      min-height: 50px;
      padding: 11px 44px 11px 46px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.5;
      box-shadow: 0 6px 18px var(--shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--muted);
      opacity: 0.85;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 8px 24px var(--shadow-hover), 0 0 0 3px var(--gold-soft);
      outline: none;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--gold-soft);
      color: var(--card-title);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .search-clear:hover {
      background: var(--gold);
      color: #1c1203;
    }

    .saved-filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-elevated);
      color: var(--card-title);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 18px var(--shadow);
      touch-action: manipulation;
      transition: all 0.22s ease;
    }

    .saved-filter-btn:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .saved-filter-btn.active {
      background: linear-gradient(135deg, var(--primary-mid), var(--primary-dark));
      border-color: var(--gold);
      color: var(--gold-bright);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26);
    }

    .saved-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--gold-soft);
      color: var(--card-title);
      border: 1px solid var(--gold-border);
    }

    .saved-filter-btn.active .saved-badge {
      background: rgba(252, 230, 159, 0.22);
      color: var(--gold-bright);
    }

    .results-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 4px 0;
    }

    .results-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .results-heading {
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: 1.24rem;
      font-weight: 700;
      color: var(--card-title);
      line-height: 1.45;
    }

    .results-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--gold-soft);
      color: var(--card-title);
      border: 1px solid var(--gold-border);
      line-height: 1.4;
    }

    .reset-link-btn {
      border: 1px solid var(--gold-border);
      background: transparent;
      color: var(--card-title);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .reset-link-btn.visible {
      display: inline-flex;
    }

    .reset-link-btn:hover {
      background: var(--gold-soft);
      border-color: var(--gold);
    }

    /* =========================================================
       1 TO 100 SEQUENTIAL LUXURY CONTENT CARDS
       ========================================================= */
    .cards-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 20px;
      padding: 22px 26px 18px;
      box-shadow:
        0 6px 20px var(--shadow),
        inset 0 1px 0 var(--glass-highlight);
      transition:
        transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.24s ease,
        box-shadow 0.24s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 140px;
      height: 140px;
      border-top-right-radius: 20px;
      background: radial-gradient(circle at 100% 0%, var(--gold-soft) 0%, transparent 72%);
      pointer-events: none;
      opacity: 0.65;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow:
        0 14px 32px var(--shadow-hover),
        0 0 0 1px var(--gold-soft);
    }

    .card-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 13px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .num-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--gold-bright) 0%, var(--gold) 52%, var(--gold-deep) 100%);
      color: #1c1203;
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: 1.24rem;
      font-weight: 700;
      line-height: 1;
      border: 1px solid rgba(255, 245, 212, 0.72);
      box-shadow:
        0 5px 14px var(--gold-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.75);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .card-title {
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: calc(clamp(1.32rem, 3vw, 1.74rem) * var(--font-scale));
      font-weight: 700;
      color: var(--card-title);
      line-height: 1.5;
      padding-top: 2px;
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .card-body {
      position: relative;
      z-index: 1;
      font-size: calc(1.03rem * var(--font-scale));
      color: var(--text);
      line-height: 1.98;
      letter-spacing: 0.1px;
      text-align: left;
      overflow-wrap: break-word;
      hyphens: none;
    }

    .card mark {
      background: var(--mark-bg);
      color: var(--mark-text);
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 600;
    }

    .card-footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .card-cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface-tint);
      border: 1px solid var(--border);
      padding: 4px 11px;
      border-radius: 999px;
      line-height: 1.45;
      max-width: 100%;
    }

    .card-cat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .card-actions {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .card-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 34px;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s ease;
    }

    .card-action-btn:hover {
      border-color: var(--gold);
      color: var(--card-title);
      background: var(--gold-soft);
    }

    .card-action-btn:active {
      transform: scale(0.94);
    }

    .card-action-btn.saved {
      background: linear-gradient(135deg, var(--primary-mid), var(--primary-dark));
      border-color: var(--gold);
      color: var(--gold-bright);
    }

    .card-action-btn.saved svg {
      fill: var(--gold-bright);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 22px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px dashed var(--gold-border);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      color: var(--gold-deep);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    [data-theme="theme-5"] .empty-icon {
      color: var(--gold-bright);
    }

    .empty-title {
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--card-title);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.96rem;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.75;
    }

    .empty-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1.5px solid var(--gold);
      background: linear-gradient(135deg, var(--primary-mid), var(--primary-dark));
      color: var(--gold-bright);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* =========================================================
       ROYAL FOOTER
       ========================================================= */
    footer {
      position: relative;
      z-index: 2;
      overflow: hidden;
      background:
        radial-gradient(ellipse 65% 80% at 50% 0%, rgba(214, 175, 59, 0.16) 0%, transparent 70%),
        linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fffaf0;
      text-align: center;
      padding:
        34px
        max(16px, env(safe-area-inset-right))
        calc(36px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      border-top: 3px solid var(--gold);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18);
    }

    footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, var(--gold-deep) 20%, var(--gold-bright) 50%, var(--gold-deep) 80%, transparent 100%);
      pointer-events: none;
    }

    .footer-credit {
      display: inline-block;
      max-width: 100%;
      font-family: 'Cinzel', serif;
      font-size: clamp(0.68rem, 2.2vw, 0.94rem);
      font-weight: 700;
      letter-spacing: clamp(1px, 0.45vw, 2.4px);
      line-height: 1.5;
      color: var(--gold-bright);
      text-transform: uppercase;
      padding: 10px clamp(16px, 4vw, 26px);
      border-radius: 999px;
      border: 1px solid var(--gold-border);
      background: rgba(0, 0, 0, 0.28);
      text-wrap: balance;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24);
    }

    /* =========================================================
       FLOATING SCROLL-TO-TOP BUTTON
       ========================================================= */
    .top-btn {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom));
      width: 50px;
      height: 50px;
      border-radius: 16px;
      border: 1.5px solid var(--gold);
      background: linear-gradient(145deg, var(--primary-mid), var(--primary-dark));
      color: var(--gold-bright);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.36),
        0 0 0 2px rgba(214, 175, 59, 0.18),
        inset 0 1px 0 rgba(255, 245, 210, 0.3);
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(16px) scale(0.85);
      touch-action: manipulation;
      transition:
        opacity 0.25s ease,
        visibility 0.25s ease,
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .top-btn.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .top-btn:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .top-btn:active {
      transform: scale(0.93);
    }

    /* =========================================================
       TOAST NOTIFICATION
       ========================================================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      z-index: 140;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--glass-dark);
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================

       ========================================================= */
    .mobile-dock {

    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 125;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .settings-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 130;
      max-width: 520px;
      margin: 0 auto;
      background: var(--surface-elevated);
      color: var(--text);
      border-top: 2px solid var(--gold);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -16px 46px rgba(0, 0, 0, 0.38);
      transform: translateY(105%);
      visibility: hidden;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.3s ease;
    }

    .settings-sheet.open {
      transform: translateY(0);
      visibility: visible;
    }

    .sheet-handle {
      width: 44px;
      height: 4.5px;
      border-radius: 999px;
      background: var(--gold-border);
      margin: 0 auto 14px;
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);

    .sheet-title {
      font-family: 'Rasa', 'Noto Sans Gujarati', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--card-title);
      line-height: 1.4;
    }

    .sheet-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-tint);
      color: var(--card-title);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-group {
      margin-bottom: 20px;
    }

    .sheet-group:last-child {
      margin-bottom: 0;
    }

    .sheet-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 11px;
    }

    .sheet-theme-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .sheet-theme-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 10px 4px;
      border-radius: 15px;
      border: 1.5px solid var(--border);
      background: var(--surface-tint);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    }

    .sheet-theme-btn.active {
      border-color: var(--gold);
      background: var(--gold-soft);
      color: var(--card-title);
      box-shadow: 0 0 0 1px var(--gold);
    }

    .sheet-theme-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(252, 230, 159, 0.8);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);

    .sheet-font-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--surface-tint);
      border: 1px solid var(--border);
    }

    .sheet-font-btn {
      flex: 1;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--card-title);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sheet-font-btn:active {
      transform: scale(0.96);
    }

    .sheet-font-val {
      min-width: 60px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--card-title);

       ========================================================= */
    @media (max-width: 960px) {

        gap: 11px;
        padding: 13px;
      }

        margin-bottom: 16px;
        gap: 8px;
      }

      .theme-pill {
        padding: 6px 13px;
        gap: 10px;
      }

      .font-pill {
        display: none;
      }

        padding: 0 12px 36px;
      }

        gap: 10px;
        border-radius: 22px;
      }

      .vibhag-card {
        padding: 12px 11px 13px;
        gap: 10px;
        border-radius: 16px;
      }

      .vibhag-card:hover {
        transform: none;
      }

      .vibhag-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
      }

      .vibhag-icon svg {
        width: 18px;
        height: 18px;
      }

      .vibhag-count {
        font-size: 0.7rem;
        padding: 2px 8px;
      }

      .vibhag-name {
        font-size: 1.04rem;
        line-height: 1.38;
      }

      .search-row {
        gap: 8px;
      }

      .search-input {
        min-height: 46px;
        font-size: 0.94rem;
        border-radius: 14px;
        padding: 10px 40px 10px 42px;
      }

      .search-icon {
        left: 13px;
      }

      .saved-filter-btn {
        min-height: 46px;
        padding: 0 12px;
        border-radius: 14px;
        font-size: 0.84rem;
      }

      .saved-filter-label {
        display: none;
      }

      .cards-list {
        gap: 13px;
      }

      .card {
        padding: 17px 16px 14px;
        border-radius: 18px;
      }

      .card:hover {
        transform: none;
      }

      .card-header {
        gap: 12px;
        margin-bottom: 11px;
        padding-bottom: 10px;
      }

      .num-badge {
        min-width: 40px;
        height: 40px;
        border-radius: 12px;
        font-size: 1.15rem;
      }

      .card-title {
        font-size: calc(clamp(1.24rem, 4.8vw, 1.48rem) * var(--font-scale));
      }

      .card-body {
        font-size: calc(0.99rem * var(--font-scale));
        line-height: 1.94;
      }

      .card-footer {
        gap: 8px;
        margin-top: 13px;
        padding-top: 10px;
      }

      .card-cat-chip {
        font-size: 0.74rem;
        padding: 3px 10px;
      }

      .card-action-btn {
        min-height: 34px;
        padding: 4px 10px;
        font-size: 0.75rem;
      }

      /* Native Mobile Floating Bottom Navigation Dock */
      .mobile-dock {
        display: flex;
        align-items: center;
        justify-content: space-around;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 100;
        max-width: 440px;
        margin: 0 auto;
        min-height: 60px;
        padding: 6px 8px;
        border-radius: 22px;
        background: var(--glass-dark);
        backdrop-filter: blur(20px) saturate(170%);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
        border: 1.5px solid var(--gold-border);
        box-shadow:
          0 14px 36px rgba(0, 0, 0, 0.46),
          inset 0 1px 0 rgba(255, 245, 210, 0.24);
      }

      .dock-btn {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 6px 4px;
        border: none;
        border-radius: 15px;
        background: transparent;
        color: rgba(255, 248, 228, 0.8);
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 1.25;
        cursor: pointer;
        touch-action: manipulation;
        transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      .dock-btn:active {
        transform: scale(0.92);
      }

      .dock-btn.active {
        background: rgba(214, 175, 59, 0.22);
        color: var(--gold-bright);
      }

      .dock-badge {
        position: absolute;
        top: 2px;
        right: calc(50% - 20px);
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--gold);
        color: #1c1203;
        font-size: 0.65rem;
        font-weight: 700;
        display: none;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .dock-badge.visible {
        display: inline-flex;
      }

      /* Full Clearance Above Mobile Dock */
      footer {
        padding: 30px 14px calc(98px + env(safe-area-inset-bottom));
        border-top-left-radius: 26px;
        border-top-right-radius: 26px;
      }

      .top-btn {
        width: 48px;
        height: 48px;
        right: 14px;
        bottom: calc(82px + env(safe-area-inset-bottom));
        z-index: 95;
      }

      .toast {
        bottom: calc(84px + env(safe-area-inset-bottom));
      }
    }

    /* Ultra-Compact Phones (320px - 375px) */
    @media (max-width: 375px) {
      .vibhag-grid {
        gap: 8px;
        padding: 9px;
      }

      .vibhag-card {
        padding: 10px 9px 11px;
      }

      .vibhag-icon {
        width: 32px;
        height: 32px;
      }

      .vibhag-name {
        font-size: 0.95rem;
      }

      .vibhag-count {
        font-size: 0.66rem;
        padding: 2px 6px;
      }

      .card {
        padding: 15px 13px 13px;
      }

      .theme-label {
        display: none;
      }
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

      { id: 7, guNum: "૭", cat: "shakhsiyat", title: "તબ્એ તાબઈ", desc: "જિસ શખ્સ ને ઈમાન કી હાલત મેં કિસી તાબઈ સે મુલાકાત (યા ઝિયારત) કી હો—લેકિન ઈમાન કી હાલત મેં કિસી સહાબી સે મુલાકાત ન કી હો—ઔર ઈમાન કી હાલત મેં ઉસકા ઇન્તિકાલ હુઆ હો, ઉસકો તબ્એ તાબઈ કહતે હૈં." },
      { id: 8, guNum: "૮", cat: "shakhsiyat", title: "મુહાજિર", desc: "જો શખ્સ અલ્લાહ તઆલા કી રિઝા ઔર દીન કી હિફાઝત કે લિયે અપના વતન છોડકર ચલા જાએ, ઉસકો મુહાજિર કહતે હૈં. ઇસ્લામી તારીખ મેં ખાસ તૌર પર ઉન સહાબા-એ-કિરામ (રદિયલ્લાહુ અન્હુમ) કો મુહાજિર કહતે હૈં જિન્હોંને મક્કા શરીફ સે મદીના શરીફ કી તરફ હિજરત કી." },
      { id: 9, guNum: "૯", cat: "shakhsiyat", title: "અન્સાર", desc: "મદીના મુનવ્વરા કે ઉન મુબારક સહાબા-એ-કિરામ (રદિયલ્લાહુ અન્હુમ) કો અન્સાર કહતે હૈં જિન્હોંને હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ઔર મુહાજિરીન કી મદદ કી ઔર ઉન્હેં અપને ઘરોં મેં પનાહ દી." },
      { id: 10, guNum: "૧૦", cat: "shakhsiyat", title: "વલી", desc: "સહીહ અકીદે વાલા વો મુસલમાન જિસે અલ્લાહ તઆલા કા ખાસ કુર્બ (નઝદીકી) ઔર દોસ્તી હાસિલ હો—ચાહે વો સીધે અલ્લાહ કે ફઝ્લ ઔર અતા (વહબી, જૈસે પૈદાઈશી વલી) સે મિલી હો યા ફરાઈઝ કી પાબંદી, ખૂબ ઇબાદત, ગુનાહોં સે બચને ઔર હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કી પૂરી ઇતાઅત (કસ્બી) કે ઝરીએ મિલી હો—ઉસે વલી કહતે હૈં. (યાદ રખેં કે વલી મઅસૂમ નહીં હોતે, બલ્કિ અલ્લાહ કે ફઝ્લ સે મહફૂઝ હોતે હૈં)." },
      { id: 11, guNum: "૧૧", cat: "aqaid", title: "મુઅમિન", desc: "જો શખ્સ તમામ ઝરૂરિયાત-એ-દીન (અલ્લાહ કી વહદાનિયત, હુઝૂર સલ્લલ્લાહુ અલૈહિ વસલ્લમ કી રિસાલત ઔર દીન કી તમામ બુનિયાદી બાતોં) કો દિલ સે સચ્ચા માને ઔર બગૈર કિસી ઉઝ્ર (મજબૂરી) કે ઝબાન સે ઉસકા ઇકરાર કરે, ઉસકો મુઅમિન કહતે હૈં. (નેક અઅમાલ કરને સે ઈમાન કે નૂર, કૈફિયત ઔર કમાલ મેં ઇઝાફા હોતા હૈ)." },
      { id: 12, guNum: "૧૨", cat: "aqaid", title: "કાફિર", desc: "ઝરૂરિયાત-એ-દીન (જિન બાતોં પર ઈમાન લાના ઝરૂરી હૈ) મેં સે કિસી એક બાત કા ભી ઇન્કાર કરને વાલે, ઉસમેં શક (શુબહા) કરને વાલે યા ઉસકી તૌહીન (ગુસ્તાખી) કરને વાલે શખ્સ કો કાફિર કહતે હૈં." },
      { id: 13, guNum: "૧૩", cat: "aqaid", title: "મુશરિક", desc: "અલ્લાહ તઆલા કી ઝાત, ઉસકી સિફાત-એ-ખાસ્સા (ઝાતી તૌર પર કિસી કો અલ્લાહ કે બરાબર માનના) યા મુસ્તહિક-એ-ઇબાદત હોને મેં કિસી દૂસરે કો શરીક ઠહરાને વાલે કો મુશરિક કહતે હૈં." },
      { id: 14, guNum: "૧૪", cat: "aqaid", title: "ફાસિક", desc: "વો મુસલમાન જો કોઈ ગુનાહે કબીરા (બડા ગુનાહ) કરે, યા કિસી ગુનાહે સગીરા (છોટે ગુનાહ) પર હમેશગી (આદત) રખે, જબ તક સચ્ચી તૌબા ન કર લે." },
      { id: 15, guNum: "૧૫", cat: "aqaid", title: "ઝિન્દીક", desc: "વો શખ્સ જો ઝાહિરી તૌર પર કલિમા પઢતા ઔર ખુદ કો મુસલમાન કહતા હો, મગર અંદર સે કુફ્ર કે અકીદે રખતા હો ઔર ઇસ્લામ કે નામ પર ઝરૂરિયાત-એ-દીન કી ગલત તાવીલ કરકે કુફ્રિયા બાતેં ફૈલાતા હો." },
      { id: 16, guNum: "૧૬", cat: "akhirat", title: "કિરામન કાતિબીન", desc: "હર ઇન્સાન કે સાથ અલ્લાહ તઆલા કે મુકર્રર કિયે હુએ દો ફરિશ્તે રહતે હૈં—દાઈં તરફ કા ફરિશ્તા નેક કામ લિખતા હૈ ઔર બાઈં તરફ કા ફરિશ્તા બુરે કામ લિખતા હૈ. ઉન ફરિશ્તોં કો કિરામન કાતિબીન કહતે હૈં." },
      { id: 17, guNum: "૧૭", cat: "akhirat", title: "મુન્કર નકીર", desc: "અંબિયા (અલૈહિમુસ્સલામ) ઔર નાબાલિગ મઅસૂમ બચ્ચોં કે અલાવા જબ કિસી મુકલ્લફ ઇન્સાન કા ઇન્તિકાલ હોતા હૈ—દફન કિયા જાએ તો કબ્ર મેં ઔર દફન ન કિયા જાએ તો જિસ હાલ મેં હો વહીં—ઉસકે પાસ દો ફરિશ્તે આતે હૈં ઔર તીન સવાલ કરતે હૈં: (૧) તેરા રબ કૌન હૈ? (૨) તેરા દીન ક્યા હૈ? (૩) ઔર હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કી તરફ ઇશારા કરકે પૂછતે હૈં કે ઇન હસ્તી કે બારે મેં તૂ ક્યા કહતા થા? યે સવાલ કરને વાલે ફરિશ્તોં કો મુન્કર નકીર કહતે હૈં." },
      { id: 18, guNum: "૧૮", cat: "aqaid", title: "જિન્ન", desc: "અલ્લાહ તઆલા ને એક મખ્લૂક કો બગૈર ધુએં વાલી આગ સે પૈદા ફરમાકર હમારી આમ નઝરોં સે પોશીદા (છુપાકર) રખા હૈ, ઉન્હેં જિન્ન કહતે હૈં. (ઇન્સાનોં કી તરહ જિન્નાત મેં ભી મુસલમાન ઔર કાફિર હોતે હૈં, ઔર વો ભી શરીઅત કે પાબંદ હૈં)." },
      { id: 19, guNum: "૧૯", cat: "aqaid", title: "ઇબ્લીસ", desc: "યાની સબસે બડા શૈતાન, જો જિન્નાત કી કૌમ સે થા. ઉસને હઝરત આદમ (અલૈહિસ્સલામ) કો સજદા-એ-તાઝીમી કરને કે અલ્લાહ તઆલા કે હુક્મ કા તકબ્બુર (ગુરૂર) સે ઇન્કાર કિયા, જિસકી વજહ સે વો કાફિર ઔર મરદૂદ હુઆ. ઉસકી ઔલાદ કો શયાતીન કહતે હૈં ઔર ઇબ્લીસ ઉન સબકા સરદાર હૈ." },
      { id: 20, guNum: "૨૦", cat: "tarikh", title: "હિજરત", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) અલ્લાહ તઆલા કે હુક્મ સે મક્કા શરીફ છોડકર મદીના શરીફ તશરીફ લે ગએ, ઉસ મુબારક સફર કો હિજરત કહતે હૈં." },
      { id: 21, guNum: "૨૧", cat: "tarikh", title: "હિજરી સન", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કી હિજરત કે સાલ સે જો ઇસ્લામી તારીખ શુરૂ હુઈ હૈ, ઉસકો સન હિજરી કહતે હૈં." },
      { id: 22, guNum: "૨૨", cat: "tarikh", title: "ઇસવી સન", desc: "હઝરત ઈસા (અલૈહિસ્સલામ) કી પૈદાઈશ સે જો તારીખ શુરૂ હુઈ હૈ, ઉસકો સન ઇસવી કહતે હૈં." },
      { id: 23, guNum: "૨૩", cat: "tarikh", title: "ગઝવહ", desc: "જિસ જંગ યા મુહિમ મેં હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ખુદ સહાબા-એ-કિરામ કે સાથ શરીક રહે હોં—ચાહે લડાઈ હુઈ હો યા ન હુઈ હો—ઉસકો ગઝવહ કહતે હૈં." },
      { id: 24, guNum: "૨૪", cat: "tarikh", title: "સરિયહ", desc: "જિસ મુહિમ યા લડાઈ કે લિયે હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ને કિસી સહાબી કી સરદારી મેં લશ્કર ભેજા હો ઔર આપ ખુદ ઉસમેં શરીક ન હુએ હોં, ઉસકો સરિયહ કહતે હૈં." },
      { id: 25, guNum: "૨૫", cat: "aqaid", title: "મુઅજિઝા", desc: "દાવા-એ-નુબુવ્વત કે બાદ પૈગમ્બર કી સચ્ચાઈ ઝાહિર કરને કે લિયે અલ્લાહ તઆલા ઉનકે હાથોં પર ઐસી ખિલાફ-એ-આદત (કુદરત કે આમ કાનૂન સે હટકર) બાતેં ઝાહિર ફરમાતા હૈ જિસકા મુકાબલા કોઈ મુન્કિર નહીં કર સકતા; ઐસી બાતોં કો મુઅજિઝા (જમા: મુઅજિઝાત) કહતે હૈં. (દાવા-એ-નુબુવ્વત સે પહેલે ઝાહિર હો તો ઉસે 'ઇરહાસ' કહતે હૈં)." },
      { id: 26, guNum: "૨૬", cat: "aqaid", title: "કરામત", desc: "અલ્લાહ તઆલા કી અતા સે, બગૈર દાવા-એ-નુબુવ્વત કે, કિસી સહીહુલ-અકીદા વલી કે હાથોં પર કોઈ ખિલાફ-એ-આદત બાત ઝાહિર હો તો ઉસકો કરામત કહતે હૈં. (આમ મુસલમાન કે હાથોં પર ઝાહિર હો તો ઉસે 'મઊનત' કહતે હૈં)." },
      { id: 27, guNum: "૨૭", cat: "aqaid", title: "ઇસ્તિદરાજ", desc: "કિસી કાફિર, ફાસિક યા બે-દીન શખ્સ કે હાથોં પર ઉસકી મર્ઝી કે મુતાબિક કોઈ ખિલાફ-એ-આદત બાત ઝાહિર હો—જો અલ્લાહ કી તરફ સે ઉસકે લિયે ઢીલ ઔર આઝમાઈશ હોતી હૈ—તો ઉસે ઇસ્તિદરાજ કહતે હૈં. (ઔર અગર ઉસકી મર્ઝી કે ખિલાફ ઝાહિર હો તો ઉસે 'ઇહાનત' કહતે હૈં)." },
      { id: 28, guNum: "૨૮", cat: "aqaid", title: "તૌહીદ", desc: "અલ્લાહ તઆલા કો ઉસકી ઝાત, સિફાત-એ-ખાસ્સા ઔર મુસ્તહિક-એ-ઇબાદત હોને મેં અકેલા, યક્તા ઔર લા-શરીક માનને કો તૌહીદ કહતે હૈં." },
      { id: 29, guNum: "૨૯", cat: "shakhsiyat", title: "અહલે બૈત", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કે મુકદ્દસ ઘર વાલોં કો અહલે બૈત કહતે હૈં. ઇસમેં આપકી પાક બીવિયાં (અઝવાજ-એ-મુતહ્હરાત) ઔર ખાસ તૌર પર હઝરત અલી, હઝરત ફાતિમા, હઝરત હસન ઔર હઝરત હુસૈન (રદિયલ્લાહુ અન્હુમ) ઔર ઉનકી પાક ઔલાદ શામિલ હૈં." },
      { id: 30, guNum: "૩૦", cat: "aqaid", title: "અહલે સુન્નત વલ જમાઅત", desc: "વો હક જમાઅત (સવાદ-એ-આઝમ) જો હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કી સુન્નત ઔર સહાબા-એ-કિરામ (રદિયલ્લાહુ અન્હુમ) કે સહીહ રાસ્તે ઔર અકીદે પર કાઈમ હો, ઉન્હેં અહલે સુન્નત વલ જમાઅત (યાની સુન્ની) કહતે હૈં." },
      { id: 31, guNum: "૩૧", cat: "aqaid", title: "ફરિશ્તે", desc: "અલ્લાહ તઆલા કી નૂરાની ઔર મઅસૂમ (ગુનાહોં સે પાક) મખ્લૂક, જિન્હેં નૂર સે પૈદા કિયા ગયા હૈ. યે ન મર્દ હોતે હૈં ન ઔરત, ન ખાતે-પીતે હૈં, બલ્કિ હમેશા અલ્લાહ કી ઇબાદત ઔર હુક્મ કી તામીલ મેં લગે રહતે હૈં." },
      { id: 32, guNum: "૩૨", cat: "aqaid", title: "મુનાફિક", desc: "વો શખ્સ જો ઝબાન સે ઇસ્લામ કા ઇકરાર ઔર દાવા કરે, મગર અપને દિલ મેં કુફ્ર છુપાકર રખે, ઉસકો મુનાફિક (નિફાક-એ-ઇઅતિકાદી) કહતે હૈં; યે અસલી મુનાફિક કાફિર હૈ." },
      { id: 33, guNum: "૩૩", cat: "aqaid", title: "મુર્તદ", desc: "જો શખ્સ મુસલમાન હોને કે બાદ—મઆઝલ્લાહ—બગૈર કિસી ઇકરાહ (જાન કી જબરદસ્તી) કે ઇસ્લામ છોડ દે, યા કિસી ઝરૂરી-એ-દીન કા ઇન્કાર કરે, યા કોઈ કુફ્રિયા કૌલ યા ફેઅલ ઇખ્તિયાર કરે, ઉસકો મુર્તદ કહતે હૈં." },
      { id: 34, guNum: "૩૪", cat: "akhirat", title: "શફાઅત", desc: "કયામત કે દિન અલ્લાહ તઆલા કે ઇઝ્ન (ઇજાઝત) સે હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ)—જિનકે સાથ શફાઅત-એ-કુબ્રા ખાસ હૈ—ઔર આપકે સદકે સે દીગર અંબિયા, ઔલિયા, શુહદા ઔર ઉલમા કા ગુનાહગાર મુસલમાનોં (સિર્ફ અહલે ઈમાન) કી બખ્શિશ ઔર દર્જાત કી બુલંદી કે લિયે સિફારિશ ફરમાના શફાઅત કહલાતા હૈ." },
      { id: 35, guNum: "૩૫", cat: "akhirat", title: "બર્ઝખ", desc: "મૌત સે લેકર કયામત કે દિન દોબારા ઝિંદા કિયે જાને તક કા જો દરમિયાની ઝમાના ઔર આલમ (કબ્ર કા આલમ) હૈ, ઉસે બર્ઝખ કહતે હૈં." },
      { id: 36, guNum: "૩૬", cat: "akhirat", title: "પુલ સિરાત", desc: "જહન્નમ કી પીઠ પર બના હુઆ વો પુલ જો બાલ સે ઝ્યાદા બારીક ઔર તલવાર સે ઝ્યાદા તેઝ હૈ; જન્નત મેં જાને કા યેહી એક રાસ્તા હૈ. નેક મુસલમાન અપને અઅમાલ કે મુતાબિક આસાની સે પાર હો જાએંગે ઔર જિનકે નસીબ મેં અઝાબ હોગા વો જહન્નમ મેં ગિર જાએંગે." },
      { id: 37, guNum: "૩૭", cat: "akhirat", title: "હૌઝ-એ-કૌસર", desc: "મૈદાન-એ-મહશર મેં અલ્લાહ તઆલા કી તરફ સે હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કો અતા કિયા હુઆ વો અઝીમ હૌઝ, જિસકા પાની દૂધ સે ઝ્યાદા સફેદ, શહદ સે ઝ્યાદા મીઠા ઔર મુશ્ક સે ઝ્યાદા ખુશ્બૂદાર હોગા; જો એક બાર પી લેગા ઉસે ફિર કભી પ્યાસ ન લગેગી." },
      { id: 38, guNum: "૩૮", cat: "tarikh", title: "મેઅરાજ", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કા રાત કે એક થોડે સે હિસ્સે મેં જાગતી હાલત (બ-હાલત-એ-બેદારી) મેં, જિસ્મ ઔર રૂહ દોનોં કે સાથ મક્કા શરીફ (મસ્જિદ-એ-હરામ) સે બૈતુલ મકદિસ (મસ્જિદ-એ-અક્સા) ઔર વહાં સે સાતોં આસમાનોં કે ઉપર, સિદરતુલ-મુન્તહા ઔર અર્શ-એ-આઝમ સે આગે જહાં તક અલ્લાહ ને ચાહા તશરીફ લે જાના, ઔર અપને સર કી આંખોં સે—બિલા કૈફ-ઓ-મકાન (બગૈર કિસી શક્લ, જગહ યા જિહત કે)—અલ્લાહ તઆલા કા દીદાર ફરમાના મેઅરાજ કહલાતા હૈ." },
      { id: 39, guNum: "૩૯", cat: "tarikh", title: "શહીદ", desc: "જો મુસલમાન અલ્લાહ કી રાહ મેં જિહાદ કરતે હુએ યા ઝુલ્મ (મઝલૂમિયત) કી હાલત મેં કત્લ કિયા જાએ (શરીઅત કી શર્તોં કે મુતાબિક વો શહીદ-એ-હકીકી હૈ), યા ઉન દીગર અસ્બાબ (જૈસે તાઊન, ડૂબના, જલના, પેટ કી બીમારી વગૈરહ) સે વફાત પાએ જિન્હેં હદીસ મેં શહાદત ફરમાયા ગયા હૈ (શહીદ-એ-હુક્મી), ઉસે શહીદ કહતે હૈં." },
      { id: 40, guNum: "૪૦", cat: "akhlaq", title: "તકવા", desc: "અલ્લાહ તઆલા કે ખૌફ ઔર અઝમત કી વજહ સે હર ગુનાહ ઔર મના કી હુઈ ચીઝ સે બચના ઔર અલ્લાહ વ રસૂલ (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કે અહકામ પર અમલ કરના તકવા કહલાતા હૈ." },
      { id: 41, guNum: "૪૧", cat: "fiqh", title: "હદીસ", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કે કૌલ (ફરમાન), ફેઅલ (અમલ) ઔર તકરીર (કિસી સહાબી કે કૌલ યા અમલ પર આપને ખામોશી ઇખ્તિયાર ફરમાઈ હો ઔર મના ન ફરમાયા હો) કો હદીસ કહતે હૈં." },
      { id: 42, guNum: "૪૨", cat: "fiqh", title: "ફર્ઝ", desc: "વો ઝરૂરી હુક્મ જો દલીલ-એ-કતઈ (કુરાન યા હદીસ-એ-મુતવાતિર) સે સાબિત હો. ઇસકા કરને વાલા બડે સવાબ કા મુસ્તહિક ઔર બગૈર ઉઝ્ર છોડને વાલા ફાસિક ઔર અઝાબ કા મુસ્તહિક હૈ. જો ફર્ઝ દલીલ-એ-કતઈ બિલા-શુબહા સે સાબિત હો (ફર્ઝ-એ-કતઈ / ઇઅતિકાદી), ઉસકા ઇન્કાર કરને વાલા કાફિર હૈ." },
      { id: 43, guNum: "૪૩", cat: "fiqh", title: "વાજિબ", desc: "વો ઝરૂરી હુક્મ જો દલીલ-એ-ઝન્ની (જૈસે ખબર-એ-વાહિદ) સે સાબિત હો. ઇસકા કરને વાલા સવાબ કા મુસ્તહિક હૈ; એક બાર બગૈર ઉઝ્ર છોડને વાલા ગુનાહગાર ઔર છોડને કી આદત બનાને વાલા ફાસિક હૈ, મગર ઇસકા ઇન્કાર કરને વાલા કાફિર નહીં (બલ્કિ ફાસિક/ગુમરાહ) હોતા." },
      { id: 44, guNum: "૪૪", cat: "fiqh", title: "સુન્નત", desc: "હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ઔર ખુલફા-એ-રાશિદીન (રદિયલ્લાહુ અન્હુમ) કે મુબારક દીની તરીકે કો સુન્નત કહતે હૈં. જિસ અમલ પર આપને હમેશગી ફરમાઈ હો ઔર બગૈર ઉઝ્ર ન છોડા હો ઉસે સુન્નત-એ-મુઅક્કદા કહતે હૈં (એક બાર છોડના બુરા ઔર છોડને કી આદત બનાના ગુનાહ/ફિસ્ક હૈ), ઔર જિસે કભી કિયા હો ઔર કભી છોડ ભી દિયા હો ઉસે સુન્નત-એ-ગૈર મુઅક્કદા કહતે હૈં (કરને પર સવાબ હૈ ઔર ન કરને પર ગુનાહ નહીં)." },
      { id: 45, guNum: "૪૫", cat: "fiqh", title: "મુસ્તહબ (ઔર નફ્લ)", desc: "વો નેક કામ જિસકે કરને પર સવાબ મિલતા હૈ, લેકિન ન કરને પર કોઈ ગુનાહ યા મલામત નહીં હોતી, ઉસે મુસ્તહબ યા નફ્લ (મંદૂબ) કહતે હૈં." },
      { id: 46, guNum: "૪૬", cat: "fiqh", title: "મુબાહ", desc: "વો કામ જિસકે કરને મેં ન સવાબ હૈ ઔર ન છોડને મેં કોઈ ગુનાહ (જૈસે આમ ખાના-પીના યા ચલના-ફિરના); અલબત્તા સચ્ચી ઔર અચ્છી નિયત સે કિયા જાએ તો ઉસ પર ભી સવાબ મિલતા હૈ." },
      { id: 47, guNum: "૪૭", cat: "fiqh", title: "હરામ", desc: "વો કામ જિસકી મુમાનિઅત (મનાહી) દલીલ-એ-કતઈ સે સાબિત હો. ઇસસે બચના ફર્ઝ હૈ; ઇસકા કરને વાલા સખ્ત ગુનાહગાર ઔર અઝાબ કા મુસ્તહિક હૈ, ઔર હરામ-એ-કતઈ (જો બિલા-શુબહા સાબિત હો) કો હલાલ માનને વાલા કાફિર હૈ." },
      { id: 48, guNum: "૪૮", cat: "fiqh", title: "મકરૂહ-એ-તહરીમી", desc: "વો ના-પસંદીદા કામ જો હરામ કે કરીબ હો (ઔર દલીલ-એ-ઝન્ની સે મના હો). ઇસસે બચના વાજિબ હૈ; એક બાર કરને વાલા ગુનાહગાર ઔર આદત બનાને વાલા ફાસિક હૈ, મગર ઇસે હલાલ સમજને વાલા કાફિર નહીં (બલ્કિ ફાસિક/ગુમરાહ) હોતા." },
      { id: 49, guNum: "૪૯", cat: "fiqh", title: "મકરૂહ-એ-તન્ઝીહી", desc: "વો ના-પસંદીદા કામ જિસકા ન કરના બેહતર હૈ ઔર ઉસસે બચને પર સવાબ મિલતા હૈ, લેકિન કર લેને પર કોઈ ગુનાહ યા અઝાબ નહીં હોતા." },
      { id: 50, guNum: "૫૦", cat: "fiqh", title: "બિદઅત", desc: "દીન મેં કોઈ ઐસી નઈ બાત જો હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) કે ઝાહિરી ઝમાને મેં ઉસ તરહ મૌજૂદ ન થી. અકીદે મેં કોઈ નઈ બાત (બિદઅત-એ-ઇઅતિકાદિયા) હમેશા હરામ ઔર ગુમરાહી (કભી કુફ્ર) હોતી હૈ. અલબત્તા અઅમાલ ઔર તરીકોં મેં (બિદઅત-એ-અમલિયા) ઇસકી દો કિસ્મેં હૈં: (૧) બિદઅત-એ-હસના: વો અચ્છા નયા કામ જો કુરાન-ઓ-સુન્નત કે ખિલાફ ન હો ઔર કિસી સુન્નત કો ન મિટાતા હો (જૈસે દીની મદારિસ, કુરાન પર ઝેર-ઝબર, ઇસ્લામી કિતાબોં કી છપાઈ)—યે જાઈઝ ઔર બાઈસ-એ-સવાબ હૈ. (૨) બિદઅત-એ-સય્યિઅહ: વો બુરા નયા કામ જો કુરાન-ઓ-સુન્નત કે ખિલાફ હો યા કિસી સુન્નત કો મિટાતા હો—યે નાજાઈઝ ઔર ગુમરાહી હૈ." },
      { id: 51, guNum: "૫૧", cat: "aqaid", title: "તકદીર", desc: "અલ્લાહ તઆલા કે ઇલ્મ-એ-અઝલી મેં હર અચ્છી ઔર બુરી ચીઝ કા પહેલે સે લિખા ઔર મુકર્રર હોના તકદીર કહલાતા હૈ. હર ચીઝ કા ખાલિક અલ્લાહ તઆલા હૈ, લેકિન અલ્લાહ ને ઇન્સાન કો ઇરાદા ઔર ઇખ્તિયાર (કસ્બ) દિયા હૈ જિસકી બિના પર સવાબ ઔર અઝાબ હોતા હૈ; અલ્લાહ નેકી સે રાઝી ઔર બુરાઈ સે નારાઝ હોતા હૈ." },
      { id: 52, guNum: "૫૨", cat: "aqaid", title: "મઅસૂમ", desc: "ગુનાહોં સે બિલકુલ પાક ઔર મહફૂઝ હોના. અહલે સુન્નત કે અકીદે કે મુતાબિક ઇસ્મત (મઅસૂમ હોના) સિર્ફ અંબિયા (અલૈહિમુસ્સલામ) ઔર ફરિશ્તોં કે સાથ ખાસ હૈ; સહાબા-એ-કિરામ ઔર ઔલિયા-એ-કિરામ મઅસૂમ નહીં બલ્કિ અલ્લાહ કે ફઝ્લ સે મહફૂઝ હોતે હૈં." },
      { id: 53, guNum: "૫૩", cat: "aqaid", title: "ખત્મે નુબુવ્વત", desc: "હુઝૂર અક્રમ (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) અલ્લાહ તઆલા કે આખિરી નબી હૈં, આપકે બાદ કોઈ નયા નબી નહીં આ સકતા. (હઝરત ઈસા અલૈહિસ્સલામ પહેલે સે નબી હૈં ઔર કયામત કે કરીબ હુઝૂર સલ્લલ્લાહુ અલૈહિ વસલ્લમ કે ઉમ્મતી બનકર આપકી શરીઅત પર અમલ કરને કે લિયે તશરીફ લાએંગે; ઇસસે ખત્મે નુબુવ્વત પર કોઈ ફર્ક નહીં પડતા)." },
      { id: 54, guNum: "૫૪", cat: "aqaid", title: "હયાતુન-નબી", desc: "અહલે સુન્નત કા મુત્તફિકા અકીદા હૈ કે તમામ અંબિયા-એ-કિરામ (અલૈહિમુસ્સલામ) અપની કબ્રોં મેં ઉસી તરહ હકીકી, જિસ્માની ઔર દુનિયાવી હયાત સે ઝિંદા હૈં—ઉન્હેં સિર્ફ એક આન કે લિયે મૌત આઈ ઔર ફિર ઉન્હેં ઝિંદા ફરમા દિયા ગયા; વો નમાઝ પઢતે હૈં ઔર ઉન્હેં રિઝ્ક દિયા જાતા હૈ." },
      { id: 55, guNum: "૫૫", cat: "aqaid", title: "ઇલ્મ-એ-ગૈબ-એ-અતાઈ", desc: "ઝાતી ઇલ્મ-એ-ગૈબ (બગૈર કિસી કે બતાએ ખુદ જાનના) સિર્ફ અલ્લાહ તઆલા કે સાથ ખાસ હૈ; અલબત્તા અલ્લાહ તઆલા કી અતા સે હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ઔર બ-કદ્રે-મર્તબા દીગર અંબિયા કો ગૈબ કા ઇલ્મ દિયા ગયા હૈ, જિસે ઇલ્મ-એ-ગૈબ-એ-અતાઈ કહતે હૈં." },
      { id: 56, guNum: "૫૬", cat: "aqaid", title: "વસીલા (તવસ્સુલ)", desc: "દુઆ કરતે વક્ત અલ્લાહ તઆલા કી બારગાહ મેં ઉસકે મકબૂલ બંદોં (અંબિયા, સહાબા, ઔલિયા) યા અપને નેક અઅમાલ કા વાસ્તા પેશ કરના વસીલા કહલાતા હૈ. અસલ દેને વાલા અલ્લાહ હી હૈ ઔર વસીલા પેશ કરના જાઈઝ ઔર દુઆ કી કુબૂલિયત કા ઝરિયા હૈ." },
      { id: 57, guNum: "૫૭", cat: "akhirat", title: "ઈસાલ-એ-સવાબ", desc: "કોઈ નેક અમલ (તિલાવત-એ-કુરાન, ઝિક્ર, દુરૂદ, સદકા, ખૈરાત વગૈરહ) કરકે ઉસકા સવાબ ઝિંદા યા ફૌત-શુદા મુસલમાનોં (ખાસ તૌર પર અંબિયા, ઔલિયા ઔર અપને મર્હૂમીન) કી રૂહોં કો બખ્શના ઈસાલ-એ-સવાબ કહલાતા હૈ. ઇસકા સવાબ ઉન્હેં પહુંચતા હૈ ઔર બખ્શને વાલે કે સવાબ મેં કોઈ કમી નહીં હોતી. (યાદ રખેં: સિર્ફ મુસલમાનોં કો હી ઈસાલ-એ-સવાબ કિયા જા સકતા હૈ)." },
      { id: 58, guNum: "૫૮", cat: "akhirat", title: "મીઝાન-એ-અઅમાલ", desc: "કયામત કે દિન ઇન્સાનોં કે અઅમાલ (નેકી ઔર બુરાઈ) તોલને કા હકીકી તરાઝૂ, જિસકે દો પલ્લે ઔર એક ઝબાન હોગી." },
      { id: 59, guNum: "૫૯", cat: "akhirat", title: "મહશર (હશ્ર)", desc: "કયામત કે દિન તમામ ઇન્સાનોં, જિન્નોં ઔર મખ્લૂક કા હિસાબ-કિતાબ કે લિયે દોબારા ઝિંદા હોકર એક મૈદાન મેં જમા હોના મહશર કહલાતા હૈ." },
      { id: 60, guNum: "૬૦", cat: "akhirat", title: "સૂર", desc: "એક ખાસ કિસ્મ કા નરસિંઘા જિસે હઝરત ઇસ્રાફીલ (અલૈહિસ્સલામ) અલ્લાહ તઆલા કે હુક્મ સે ફૂંકેંગે—પહેલી મર્તબા ફૂંકને સે કયામત કાઈમ હોગી ઔર સબ ફના હો જાએંગે, ઔર આખિરી મર્તબા ફૂંકને સે તમામ મખ્લૂક દોબારા ઝિંદા હો જાએગી." },
      { id: 61, guNum: "૬૧", cat: "akhirat", title: "દજ્જાલ", desc: "કયામત કી બડી નિશાનિયોં મેં સે એક કાના (એક આંખ વાલા) ઔર ઝૂઠા ફિત્ના-ગર શખ્સ જો ખુદાઈ કા દાવા કરેગા ઔર મક્કા-મદીના કે અલાવા પૂરી દુનિયા મેં ફિત્ના ફૈલાએગા; આખિરકાર હઝરત ઈસા (અલૈહિસ્સલામ) ઉસે બાબ-એ-લુદ્દ કે મકામ પર કત્લ ફરમાએંગે." },
      { id: 62, guNum: "૬૨", cat: "akhirat", title: "ઇમામ મહદી (રદિયલ્લાહુ અન્હુ)", desc: "કયામત કે કરીબ અહલે બૈત (હઝરત ફાતિમા રદિયલ્લાહુ અન્હા કી ઔલાદ) મેં સે ઝાહિર હોને વાલે એક બરહક ઔર આદિલ ખલીફા, જિનકા નામ મુહમ્મદ ઔર વાલિદ કા નામ અબ્દુલ્લાહ હોગા. વો દુનિયા કો અદ્લ-ઓ-ઇન્સાફ સે ભર દેંગે ઔર હઝરત ઈસા (અલૈહિસ્સલામ) ઉનકે પીછે નમાઝ પઢેંગે." },
      { id: 63, guNum: "૬૩", cat: "akhirat", title: "યાજૂજ-માજૂજ", desc: "હઝરત નૂહ (અલૈહિસ્સલામ) કે બેટે યાફસ કી ઔલાદ મેં સે દો બડી સરકશ ઔર ફસાદી કૌમેં જો હઝરત ઝુલકર્નૈન કી બનાઈ હુઈ દીવાર કે પીછે કૈદ હૈં; કયામત કે કરીબ હઝરત ઈસા (અલૈહિસ્સલામ) કે ઝમાને મેં નિકલેંગી ઔર ઉનકી દુઆ સે હલાક હો જાએંગી." },
      { id: 64, guNum: "૬૪", cat: "akhirat", title: "દબ્બતુલ અર્ઝ", desc: "કયામત કી બડી નિશાનિયોં મેં સે એક અજીબ જાનવર જો મક્કા શરીફ મેં કોહ-એ-સફા સે નિકલેગા ઔર ઇન્સાનોં સે બાત કરેગા; વો મુઅમિન ઔર કાફિર કે ચહરે પર ખાસ નિશાન લગા દેગા જિસસે હર કોઈ પહેચાના જાએગા." },
      { id: 65, guNum: "૬૫", cat: "shakhsiyat", title: "અશરએ મુબશ્શરા", desc: "વો દસ ખુશ-નસીબ સહાબા-એ-કિરામ (રદિયલ્લાહુ અન્હુમ) જિન્હેં હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) ને એક હી મજ્લિસ મેં દુનિયા હી મેં જન્નતી હોને કી બશારત દી: (૧) હઝરત અબૂ બક્ર સિદ્દીક, (૨) હઝરત ઉમર ફારૂક, (૩) હઝરત ઉસ્માન ગની, (૪) હઝરત અલી મુર્તઝા, (૫) હઝરત તલ્હા, (૬) હઝરત ઝુબૈર, (૭) હઝરત અબ્દુર્રહમાન બિન ઔફ, (૮) હઝરત સઅદ બિન અબી વક્કાસ, (૯) હઝરત સઈદ બિન ઝૈદ, ઔર (૧૦) હઝરત અબૂ ઉબૈદા બિન જર્રાહ (રદિયલ્લાહુ અન્હુમ)." },
      { id: 66, guNum: "૬૬", cat: "fiqh", title: "કુરાન-એ-મજીદ", desc: "અલ્લાહ તઆલા કા વો આખિરી ઔર ગૈર-મખ્લૂક કલામ જો હુઝૂર (સલ્લલ્લાહુ અલૈહિ વસલ્લમ) પર અરબી ઝબાન મેં નાઝિલ હુઆ ઔર કયામત તક હર તરહ કી તબ્દીલી ઔર કમી-ઝ્યાદતી સે મહફૂઝ હૈ." },
      { id: 67, guNum: "૬૭", cat: "fiqh", title: "તફસીર", desc: "કુરાન-એ-મજીદ કી આયતોં કે સહીહ મઅના, શાન-એ-નુઝૂલ ઔર અહકામ કો હદીસ, અકવાલ-એ-સહાબા ઔર શરીઅત કે ઉસૂલોં કે મુતાબિક બયાન કરને કે ઇલ્મ કો તફસીર કહતે હૈં. (બગૈર ઇલ્મ અપની મર્ઝી સે કુરાન કા મતલબ નિકાલના હરામ હૈ)." },

      { id: 70, guNum: "૭૦", cat: "fiqh", title: "કિયાસ", desc: "કિસી નએ મસઅલે કા હુક્મ કુરાન, હદીસ ઔર ઇજ્મા મેં મૌજૂદ મિલતે-જુલતે હુક્મ (મુશ્તરિક ઇલ્લત) કી બુનિયાદ પર નિકાલના કિયાસ કહલાતા હૈ. યે શરીઅત કી ચૌથી દલીલ હૈ." },

      { id: 74, guNum: "૭૪", cat: "fiqh", title: "અઇમ્મા-એ-અર્બઅહ", desc: "અહલે સુન્નત વલ જમાઅત કે વો ચાર બરહક ફિકહી ઇમામ જિનકે મઝાહિબ દુનિયા મેં રાયજ હૈં: (૧) હઝરત ઇમામ-એ-આઝમ અબૂ હનીફા, (૨) હઝરત ઇમામ માલિક, (૩) હઝરત ઇમામ શાફિઈ, ઔર (૪) હઝરત ઇમામ અહમદ બિન હમ્બલ (રહિમહુમુલ્લાહ). યે ચારોં હક પર હૈં." },
      { id: 75, guNum: "૭૫", cat: "fiqh", title: "ફતવા", desc: "કિસી શરઈ સવાલ યા મસઅલે કે બારે મેં મુફ્તી (શરીઅત કે માહિર આલિમ) કા કુરાન, હદીસ ઔર ફિકહ કી રોશની મેં શરઈ હુક્મ બયાન કરના ફતવા કહલાતા હૈ." },

      { id: 79, guNum: "૭૯", cat: "ibadat", title: "અદા ઔર કઝા", desc: "કિસી ફર્ઝ યા વાજિબ ઇબાદત (જૈસે નમાઝ યા રોઝા) કો ઉસકે મુકર્રર શરઈ વક્ત કે અંદર પૂરા કરના 'અદા' કહલાતા હૈ, ઔર વક્ત નિકલ જાને કે બાદ પૂરા કરના 'કઝા' કહલાતા હૈ." },

      { id: 84, guNum: "૮૪", cat: "ibadat", title: "ઉશ્ર", desc: "ઝમીન કી પૈદાવાર (ફસલ) પર લગને વાલી શરઈ ઝકાત—જો બારિશ યા કુદરતી પાની સે ઉગને વાલી ફસલ કા દસવાં હિસ્સા (૧/૧૦) ઔર મહેનત યા મશીન કે પાની સે ઉગને વાલી ફસલ કા બીસવાં હિસ્સા (૧/૨૦) હોતી હૈ." },
