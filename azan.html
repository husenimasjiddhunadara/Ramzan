<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>અઝાન (Azan) — Islamic Graphic Poster</title>
  <!-- Google Fonts: Amiri & Scheherazade New for authentic Arabic script, Noto Sans Gujarati for Gujarati, Cinzel for ornamental credit, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & LUXURY THEME PALETTES
       ========================================================================== */
    :root {
      /* Dynamic typography & layout controls */
      --arabic-size: 23px;
      --arabic-font: 'Scheherazade New', 'Amiri', serif;
      --gujarati-font: 'Noto Sans Gujarati', sans-serif;
      --credit-font: 'Cinzel', 'Inter', serif;
      --ui-font: 'Inter', system-ui, -apple-system, sans-serif;

      /* Default Theme: Royal Emerald & Gold */
      --bg-page: #063b2c;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-border: rgba(212, 175, 55, 0.28);
      --bg-arch: rgba(4, 38, 28, 0.72);
      --accent: #d4af37;
      --accent-bright: #f2d57e;
      --accent-muted: rgba(212, 175, 55, 0.45);
      --watermark-color: #d4af37;
      --watermark-opacity: 0.055;
      --text-arabic: #fffdf5;
      --text-pronunciation: #f5e6be;
      --text-translation: #dce8e2;
      --text-title-gu: #f8e7b5;
      --text-badge: #063b2c;
      --shadow-poster: 0 28px 70px rgba(0, 0, 0, 0.55);
    }

    /* Theme 2: Ivory & Antique Gold */
    [data-theme="ivory"] {
      --bg-page: #fdfaf2;
      --bg-card: rgba(184, 134, 11, 0.045);
      --bg-card-border: rgba(184, 134, 11, 0.30);
      --bg-arch: rgba(6, 59, 44, 0.05);
      --accent: #b8860b;
      --accent-bright: #063b2c;
      --accent-muted: rgba(184, 134, 11, 0.45);
      --watermark-color: #b8860b;
      --watermark-opacity: 0.065;
      --text-arabic: #063b2c;
      --text-pronunciation: #1a2e26;
      --text-translation: #3b4742;
      --text-title-gu: #063b2c;
      --text-badge: #fdfaf2;
      --shadow-poster: 0 24px 60px rgba(30, 24, 10, 0.18);
    }

    /* Theme 3: Midnight Navy & Gold */
    [data-theme="navy"] {
      --bg-page: #0b192c;
      --bg-card: rgba(229, 193, 88, 0.045);
      --bg-card-border: rgba(229, 193, 88, 0.28);
      --bg-arch: rgba(7, 17, 32, 0.72);
      --accent: #e5c158;
      --accent-bright: #f9e39e;
      --accent-muted: rgba(229, 193, 88, 0.42);
      --watermark-color: #e5c158;
      --watermark-opacity: 0.05;
      --text-arabic: #fdfaf0;
      --text-pronunciation: #f4e2b0;
      --text-translation: #cbd7e6;
      --text-title-gu: #f7e4ab;
      --text-badge: #0b192c;
      --shadow-poster: 0 28px 70px rgba(0, 0, 0, 0.6);
    }

    /* Theme 4: Classic White Print (Ink-Saving) */
    [data-theme="white"] {
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-card-border: rgba(184, 134, 11, 0.35);
      --bg-arch: rgba(6, 78, 59, 0.035);
      --accent: #b8860b;
      --accent-bright: #064e3b;
      --accent-muted: rgba(6, 78, 59, 0.32);
      --watermark-color: #064e3b;
      --watermark-opacity: 0.035;
      --text-arabic: #064e3b;
      --text-pronunciation: #111827;
      --text-translation: #374151;
      --text-title-gu: #064e3b;
      --text-badge: #ffffff;
      --shadow-poster: 0 20px 55px rgba(0, 0, 0, 0.14);
    }

    /* ==========================================================================
       2. GLOBAL RESET & WORKSPACE STAGE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--ui-font);
      background: radial-gradient(circle at top, #1b242c 0%, #0e1318 100%);
      min-height: 100vh;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 48px;
      overflow-x: hidden;
    }

    /* ==========================================================================
       3. FLOATING DESIGNER CONTROL BAR (HIDDEN ON PRINT)
       ========================================================================== */
    .control-bar {
      position: sticky;
      top: 12px;
      z-index: 100;
      width: 100%;
      max-width: 920px;
      background: rgba(17, 24, 31, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d4af37;
      margin-right: 2px;
    }

    /* Theme Swatch Buttons */
    .theme-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(212, 175, 55, 0.55);
    }

    .theme-btn.active {
      background: rgba(212, 175, 55, 0.18);
      border-color: #d4af37;
      color: #fef3c7;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.45);
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #d4af37;
      flex-shrink: 0;
    }

    /* Font Slider & Script Toggle */
    .slider-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .slider-wrap input[type="range"] {
      width: 88px;
      accent-color: #d4af37;
      cursor: pointer;
    }

    .size-badge {
      font-size: 11px;
      font-weight: 600;
      color: #fef3c7;
      min-width: 34px;
      text-align: right;
    }

    .script-select {
      background: rgba(255, 255, 255, 0.07);
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: var(--ui-font);
      cursor: pointer;
      outline: none;
    }

    .script-select option {
      background: #111827;
      color: #f3f4f6;
    }

    /* ==========================================================================
       4. A4 POSTER CANVAS (210mm x 297mm)
       ========================================================================== */
    .poster-stage {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .poster-sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      max-width: 100%;
      background-color: var(--bg-page);
      box-shadow: var(--shadow-poster);
      border-radius: 4px;
      overflow: hidden;
      padding: 10mm 11mm;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Seamless Islamic Geometric Watermark Layer */
    .watermark-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      color: var(--watermark-color);
      opacity: var(--watermark-opacity);
    }

    /* Subtle Radial Vignette Glow for Depth */
    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 16%, rgba(212, 175, 55, 0.11) 0%, transparent 62%);
    }

    /* Double Ornamental Border Frame */
    .outer-frame {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 2.2px solid var(--accent);
      border-radius: 6px;
      padding: 4.5px;
    }

    .inner-frame {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--accent-muted);
      border-radius: 4px;
      padding: 10px 18px 12px;
      justify-content: space-between;
    }

    /* Ornamental Corner Flourishes */
    .corner-ornament {
      position: absolute;
      width: 44px;
      height: 44px;
      color: var(--accent);
      pointer-events: none;
      z-index: 4;
    }

    .corner-tl { top: 2px; left: 2px; }
    .corner-tr { top: 2px; right: 2px; transform: scaleX(-1); }
    .corner-bl { bottom: 2px; left: 2px; transform: scaleY(-1); }
    .corner-br { bottom: 2px; right: 2px; transform: scale(-1, -1); }

    /* ==========================================================================
       7. PERMANENT ORNAMENTAL ISLAMIC CREDIT FOOTER BADGE
       ========================================================================== */
    .poster-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      padding-top: 6px;
      position: relative;
      z-index: 3;
    }

    .footer-flourish {
      flex: 1;
      max-width: 115px;
      height: 14px;
      color: var(--accent);
      opacity: 0.82;
    }

    .credit-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 18px;
      border-radius: 999px;
      background: var(--bg-arch);
      border: 1px solid var(--accent-muted);
      box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.14);
      position: relative;
    }

    .credit-star {
      width: 11px;
      height: 11px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .credit-text {
      font-family: var(--credit-font);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      color: var(--accent-bright);
      white-space: nowrap;
      line-height: 1.2;
    }

    /* ==========================================================================
       8. RESPONSIVE MOBILE ADAPTATION (NO HORIZONTAL SCROLL)
       ========================================================================== */
    @media (max-width: 820px) {
      body {
        padding: 10px 8px 32px;
      }

      .control-bar {
        position: relative;
        top: 0;
        padding: 10px 12px;
        gap: 10px;
      }

      .poster-sheet {
        width: 100%;
        min-height: auto;
        padding: 12px;
      }

      .inner-frame {
        padding: 10px 10px 12px;
      }

      .verse-card {
        grid-template-columns: 30px 1fr;
        padding: 8px 10px;
        gap: 8px;
      }

      .verse-badge {
        width: 28px;
        height: 28px;
      }

      .verse-accent-end {
        display: none;
      }

      .corner-ornament {
        width: 32px;
        height: 32px;
      }

      .poster-footer {
        gap: 6px;
      }

      .footer-flourish {
        max-width: 44px;
      }

      .credit-ribbon {
        padding: 4px 12px;
        gap: 6px;
      }

      .credit-text {
        font-size: 9.5px;
        letter-spacing: 0.08em;
      }
    }

    /* ==========================================================================
       9. EXACT A4 PORTRAIT PRINT STYLING
       ========================================================================== */
/* ... existing code ... -->

  <!-- ========================================================================
       VANILLA JAVASCRIPT: THEME & TYPOGRAPHY CONTROLS
       ======================================================================== -->
  <script>
    (function () {
      'use strict';

      try {
        const posterSheet = document.getElementById('posterSheet');
        const themeButtons = document.querySelectorAll('.theme-btn');
        const arabicSizeSlider = document.getElementById('arabicSizeSlider');
        const arabicSizeValue = document.getElementById('arabicSizeValue');
        const arabicFontSelect = document.getElementById('arabicFontSelect');

        /* 1. Luxury Theme Switcher */
        themeButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            const selectedTheme = btn.getAttribute('data-theme-target');
            if (!selectedTheme || !posterSheet) return;

            posterSheet.setAttribute('data-theme', selectedTheme);

            themeButtons.forEach(function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
          });
        });

        /* 2. Live Arabic Font Size Control */
        if (arabicSizeSlider && arabicSizeValue && posterSheet) {
          arabicSizeSlider.addEventListener('input', function () {
            const sizePx = arabicSizeSlider.value + 'px';
            posterSheet.style.setProperty('--arabic-size', sizePx);
            arabicSizeValue.textContent = sizePx;
          });
        }

        /* 3. Arabic Script Font Selector */
        if (arabicFontSelect && posterSheet) {
          arabicFontSelect.addEventListener('change', function () {
            posterSheet.style.setProperty('--arabic-font', arabicFontSelect.value);
          });
        }
      } catch (err) {
        console.error('Poster control initialization error:', err);
      }
    })();
  </script>
